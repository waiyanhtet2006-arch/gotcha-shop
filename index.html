<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOTCHA PRIME | LUXURY APPAREL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Premium Serif Font -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: white; }
        .serif { font-family: 'Playfair Display', serif; }
        .gold-gradient { background: linear-gradient(45deg, #d4af37, #f9e29c, #b8860b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .premium-input { background: transparent; border-bottom: 1px solid #333; transition: border-color 0.3s; }
        .premium-input:focus { border-color: #d4af37; outline: none; }
        .cart-dot { position: absolute; top: 0; right: 0; width: 8px; height: 8px; background: #d4af37; border-radius: 50%; }
    </style>
</head>
<body>

    <!-- NAVIGATION -->
    <nav class="p-8 flex justify-between items-center max-w-7xl mx-auto">
        <div class="text-2xl serif font-bold tracking-widest uppercase italic gold-gradient">Gotcha Prime</div>
        <div class="relative cursor-pointer group" onclick="toggleCart()">
            <span class="text-sm tracking-widest uppercase font-semibold group-hover:text-yellow-500 transition">Bag</span>
            <div id="cart-indicator" class="hidden cart-dot"></div>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <main class="min-h-screen flex flex-col items-center justify-center px-6 -mt-20">
        <div class="max-w-2xl text-center space-y-6">
            <h2 class="text-6xl serif italic">The Prime Jersey</h2>
            <p class="text-gray-400 tracking-[0.2em] uppercase text-xs">Limited Edition • Handcrafted Excellence</p>
            
            <div class="pt-10">
                <img src="YOUR_JERSEY_IMAGE_URL" alt="Jersey" class="w-full max-w-md mx-auto drop-shadow-2xl transition hover:scale-105 duration-700">
            </div>

            <div class="flex flex-col items-center pt-8">
                <span class="text-2xl font-light mb-6">$250.00</span> <!-- Higher price = Premium feel -->
                <button onclick="addToCart('The Prime Jersey', 250)" 
                        class="px-12 py-4 border border-white text-xs tracking-[0.3em] uppercase hover:bg-white hover:text-black transition-all duration-500">
                    Add to Collection
                </button>
            </div>
        </div>
    </main>

    <!-- SLIDE-OVER CART (GLASSMORPHISM) -->
    <div id="cart-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-black/80" onclick="toggleCart()"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-md glass p-10 flex flex-col">
            <div class="flex justify-between items-center mb-12">
                <h2 class="serif text-3xl italic">Your Selection</h2>
                <button onclick="toggleCart()" class="text-gray-500 hover:text-white">Close</button>
            </div>

            <div id="cart-items" class="flex-grow space-y-8 overflow-y-auto"></div>

            <div id="checkout-area" class="pt-8 border-t border-white/10 hidden">
                <form id="order-form" onsubmit="handleOrder(event)" class="space-y-8">
                    <input type="text" id="name" placeholder="FULL NAME" required class="w-full premium-input py-2 text-sm tracking-widest">
                    <input type="text" id="phone" placeholder="CONTACT NUMBER" required class="w-full premium-input py-2 text-sm tracking-widest">
                    <textarea id="address" placeholder="SHIPPING ADDRESS" required class="w-full premium-input py-2 text-sm tracking-widest h-20"></textarea>
                    
                    <button type="submit" id="submit-btn" class="w-full bg-white text-black py-5 text-xs tracking-[0.4em] uppercase font-bold hover:bg-yellow-500 transition duration-500">
                        Complete Order
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            telegramToken: "8631368822:AAHY31uXLftZJjFjXlSiUJszeiMj2hPu6Ik",
            telegramChatId: "7194426571",
            airtableToken: "patChpUg2SUHRGuIh.f98b61f7e06b47534f6e53c55f9fe4469999eb57eec3a23d0b4a4e6a685f4b06",
            airtableBaseId: "appG57X3qkk4A5IHP",
            airtableTableName: "Orders"
        };

        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            document.getElementById('cart-indicator').classList.remove('hidden');
            toggleCart();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const checkout = document.getElementById('checkout-area');
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-500 tracking-widest uppercase text-xs">Selection is empty</p>';
                checkout.classList.add('hidden');
            } else {
                container.innerHTML = cart.map(i => `
                    <div class="flex justify-between items-end border-b border-white/5 pb-4">
                        <div>
                            <p class="serif italic text-lg">${i.name}</p>
                            <p class="text-xs text-gray-500 tracking-widest uppercase">Qty: 1</p>
                        </div>
                        <span class="text-sm font-light">$${i.price}.00</span>
                    </div>
                `).join('');
                checkout.classList.remove('hidden');
            }
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        async function handleOrder(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "AUTHENTICATING...";

            const orderData = {
                OrderID: "GP-" + Math.floor(1000 + Math.random() * 9000),
                CustomerName: document.getElementById('name').value,
                Phone: document.getElementById('phone').value,
                Address: document.getElementById('address').value,
                Items: cart.map(i => i.name).join(", "),
                Total: cart.reduce((sum, i) => sum + i.price, 0),
                Status: "Pending"
            };

            try {
                const response = await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBaseId}/${CONFIG.airtableTableName}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${CONFIG.airtableToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fields: orderData })
                });

                if (response.ok) {
                    alert("Order Placed Successfully. We will contact you shortly.");
                    cart = [];
                    location.reload();
                } else {
                    const err = await response.json();
                    alert("System error: " + err.error.message);
                }
            } catch (error) {
                alert("Connection failed.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Complete Order";
            }
        }
    </script>
</body>
</html>
