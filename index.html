<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOTCHA</title>

<style>
body{
  background:#0b0b0b;
  color:#f5f5f0;
  font-family:Arial;
  text-align:center;
}
.card{
  background:#111;
  padding:20px;
  margin:20px auto;
  width:300px;
}
img{width:100%;}
button{
  padding:10px;
  width:100%;
  margin-top:10px;
  background:#12c9c0;
  border:none;
}
input, select, textarea{
  width:100%;
  padding:8px;
  margin:5px 0;
}
</style>
</head>
<body>

<h1>GOTCHA</h1>

<div class="card">
  <img src="https://i.ibb.co/7tc0CRN8/IMG-4922.jpg">
  <h3>CULTURAL TREASURE (WHITE)</h3>
  <p>48,000 MMK</p>
</div>

<h2>Checkout</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<textarea id="address" placeholder="Delivery Address"></textarea>

<h3>Scan KBZPay QR</h3>
<img src="https://i.ibb.co/yourQRlink.jpg">

<input type="file" id="screenshot">

<button onclick="sendOrder()">Confirm Order</button>

<script>
async function sendOrder(){

const name = document.getElementById("name").value;
const phone = document.getElementById("phone").value;
const address = document.getElementById("address").value;
const file = document.getElementById("screenshot").files[0];

if(!file){
  alert("Upload payment screenshot");
  return;
}

let formData = new FormData();
formData.append("name", name);
formData.append("phone", phone);
formData.append("address", address);
formData.append("photo", file);

await fetch("/.netlify/functions/send-order",{
  method:"POST",
  body:formData
});

alert("Order sent successfully!");
}
</script>

</body>
</html>
