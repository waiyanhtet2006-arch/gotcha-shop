<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GOTCHA | Official Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root{
--bg: #090C10; 
--card-bg: rgba(22, 27, 34, 0.75); 
--card-border: rgba(255, 255, 255, 0.1);
--primary: #D4AF37; 
--accent: #E5C56D; 
--text: #EDF2F7;
--text-secondary: #A0AEC0;
--danger: #FF6B6B;
--success: #48BB78;
--pill-radius: 16px; 
}

body{
    margin:0;
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text); 
    line-height: 1.6; 
    overflow-x: hidden;
}
.container{width:95%;max-width:1100px;margin:auto;padding:20px;}

header{
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding: 20px 5%; 
    position: sticky; 
    top: 0;
    background: rgba(9, 12, 16, 0.9); 
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--card-border);
    z-index: 2000;
}
h1{
    color:var(--primary); 
    letter-spacing: 0.4em; 
    font-weight: 800; 
    margin: 0; 
    font-size: 22px;
    text-transform: uppercase;
}

.hero {
    height: 50vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://i.ibb.co/LdsXqW7/image-35.png') center/cover;
    border-radius: 30px;
    margin-top: 20px;
    padding: 20px;
}
.hero h2 { font-size: 2.5rem; margin: 0; letter-spacing: 5px; color: #fff; }

.menu-btn { display: flex; flex-direction: column; justify-content: space-around; width: 30px; height: 22px; background: transparent; border: none; cursor: pointer; z-index: 1001; }
.menu-btn div { width: 30px; height: 3px; background: var(--primary); transition: 0.3s; border-radius: 4px; }

/* Enhanced Nav Bar with Necessary Pages */
.nav-bar { position: fixed; top: 0; right: -100%; width: 280px; height: 100%; background: #161b22; display: flex; flex-direction: column; padding: 80px 20px; gap: 15px; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; box-shadow: -5px 0 25px rgba(0,0,0,0.5); border-left: 1px solid var(--card-border); }
.nav-bar.active { right: 0; }
.nav-link { color: var(--text-secondary); text-decoration: none; font-size: 14px; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);}
.nav-link:hover { color: var(--primary); }
.nav-link.active-tab { color: var(--primary); font-weight: bold; }

.page { display: none; animation: fadeIn 0.4s ease; min-height: 60vh; }
.page.active { display: block; }
.section{
    background: var(--card-bg);
    padding: 35px;
    border-radius: 24px; 
    margin-top: 25px; 
    border: 1px solid var(--card-border); 
}

.products{display:flex; justify-content: center; margin-top: 25px;}
.card{
    background: var(--card-bg);
    padding: 24px;
    border-radius: 24px;
    border: 1px solid var(--card-border); 
    text-align: center; 
    max-width: 400px;
}
.card img{width:100%; border-radius:18px; transition: 0.3s;}

.color-options { display: flex; justify-content: center; gap: 15px; margin: 15px 0; }
.color-dot { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
.color-dot.active { border-color: var(--primary); transform: scale(1.1); }
.dot-white { background: #FFFFFF; }
.dot-black { background: #1A1A1A; }

.btn{ 
    background: linear-gradient(135deg, #D4AF37, #B38F1E); 
    color: #101217; 
    width:100%; 
    margin-top:20px; 
    padding:16px; 
    border:none; 
    border-radius: var(--pill-radius); 
    font-weight: bold; 
    cursor: pointer; 
}

#toast { position:fixed; bottom:24px; right:24px; background: var(--primary); color:#101217; padding:14px 28px; border-radius: var(--pill-radius); display:none; z-index:2000; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>

<body>

<header>
    <h1>GOTCHA</h1>
    <button class="menu-btn" onclick="toggleMenu()">
        <div></div><div style="margin: 5px 0;"></div><div></div>
    </button>
    <div class="nav-bar" id="mainNav">
        <span class="nav-link active-tab" onclick="switchPage('shop')">Home</span>
        <span class="nav-link" onclick="switchPage('shop')">Collection</span>
        <span class="nav-link" onclick="switchPage('orders')">Track Order</span>
        <span class="nav-link" onclick="handleContact()">Contact Us</span>
        <span class="nav-link" id="authBtn" onclick="handleAuth()" style="margin-top: 20px; color: var(--primary);">Sign In</span>
    </div>
</header>

<div class="container">
    
    <div id="page-shop" class="page active">
        <section class="hero">
            <p>New Arrival</p>
            <h2>CULTURAL TREASURE</h2>
        </section>

        <div class="products">
            <div class="card">
                <img id="mainProductImg" src="https://i.ibb.co/LdsXqW7/image-35.png" alt="Cultural Treasure">
                <h3 id="productTitle">CULTURAL TREASURE (BLACK)</h3>
                <p style="color: var(--primary);">48,000 MMK</p>
                
                <div class="color-options">
                    <div class="color-dot dot-black active" onclick="switchColor('Black', 'https://i.ibb.co/LdsXqW7/image-35.png', this)"></div>
                    <div class="color-dot dot-white" onclick="switchColor('White', 'https://i.ibb.co/LdsXqW7/image-36.png', this)"></div>
                </div>

                <select id="sizeMain"><option value="">Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
                <button class="btn" onclick="addSelectedToCart()">Add To Cart</button>
            </div>
        </div>

        <div class="section">
            <h2 style="color: var(--primary);">Your Cart</h2>
            <div id="cartItems"></div>
            <h3 style="text-align:right;">Total: <span id="cartTotal">0</span> MMK</h3>
            
            <div id="checkoutForm" style="display:none;">
                <input id="name" placeholder="Name"><input id="phone" placeholder="Phone"><textarea id="address" placeholder="Address"></textarea>
                <button class="btn" onclick="sendOrder()">Confirm Order</button>
            </div>
        </div>
    </div>

    <div id="page-orders" class="page">
        <div class="section">
            <h2 style="color: var(--primary);">Track Your Orders</h2>
            <div id="resultsList"><p style="text-align:center; padding:20px;">No history found.</p></div>
        </div>
    </div>
</div>

<div id="toast">Added 📦</div>

<script>
let cart=[];
let currentColor = "Black";

function toggleMenu() { document.getElementById("mainNav").classList.toggle("active"); }

function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    toggleMenu();
}

function switchColor(color, imgUrl, el) {
    currentColor = color;
    document.getElementById('mainProductImg').src = imgUrl;
    document.getElementById('productTitle').innerText = `CULTURAL TREASURE (${color.toUpperCase()})`;
    document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('active'));
    el.classList.add('active');
}

function handleContact() { alert("Contact us via Telegram: @GotchaSupport"); toggleMenu(); }

// Simplified core functions (Keep your original logic here)
function addSelectedToCart() {
    const size = document.getElementById('sizeMain').value;
    if(!size) return alert("Select size");
    cart.push({name: `Cultural Treasure (${currentColor})`, price: 48000, size: size});
    updateCartUI();
    document.getElementById("toast").style.display = "block";
    setTimeout(()=> document.getElementById("toast").style.display = "none", 2000);
}

function updateCartUI() {
    const div = document.getElementById("cartItems");
    let total = 0;
    div.innerHTML = cart.map(i => {
        total += i.price;
        return `<div style="padding:10px 0; border-bottom:1px solid #333;">${i.name} (${i.size}) - ${i.price} MMK</div>`;
    }).join('');
    document.getElementById("cartTotal").innerText = total.toLocaleString();
    if(cart.length > 0) document.getElementById("checkoutForm").style.display = "block";
}
</script>

</body>
</html>
