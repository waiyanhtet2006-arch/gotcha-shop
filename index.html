<!DOCTYPE html>
<html>
<head>
<title>Gotcha Shop</title>
<style>
body{
font-family:Arial;
background:#111;
color:white;
margin:0;
padding:20px;
}

.section{
background:#1c1c1c;
padding:15px;
margin-bottom:20px;
border-radius:10px;
}

button{
background:#ff9800;
border:none;
padding:8px 12px;
margin-top:5px;
border-radius:5px;
cursor:pointer;
}

input,select,textarea{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
border-radius:5px;
border:none;
}

.cart-item{
border-bottom:1px solid #333;
padding:8px 0;
}

.remove-btn{
background:red;
color:white;
padding:3px 6px;
font-size:12px;
}

#kbzQRBox{
display:none;
text-align:center;
margin-top:10px;
}

#kbzQRBox img{
width:200px;
border-radius:10px;
}
</style>
</head>
<body>

<h1>🛍 Gotcha Shop</h1>

<!-- PRODUCTS -->
<div class="section">
<h2>Products</h2>

<button onclick="addToCart('Shirt','M',15000)">Add Shirt (M) - 15000</button><br>
<button onclick="addToCart('Shirt','L',15000)">Add Shirt (L) - 15000</button><br>
<button onclick="addToCart('Pants','M',20000)">Add Pants (M) - 20000</button>

</div>

<!-- CART -->
<div class="section">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<h3>Total: <span id="cartTotal">0</span> MMK</h3>
</div>

<!-- CHECKOUT -->
<div class="section">
<h2>Checkout</h2>

<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone">
<input id="address" placeholder="Address">

<label>Payment Method</label>
<select id="paymentMethod" onchange="handlePaymentChange()">
<option value="">Select Payment</option>
<option value="kbz">KBZPay</option>
<option value="cod">Cash On Delivery</option>
</select>

<!-- KBZ QR POPUP -->
<div id="kbzQRBox">
<p>Scan this QR and pay:</p>
<img src="your-kbz-qr.jpg">
<input type="file" id="paymentScreenshot">
</div>

<button onclick="sendOrder()">Place Order</button>

</div>

<!-- CANCEL -->
<div class="section">
<h2>Cancel Order</h2>

<input id="cancelOrderId" placeholder="Enter Order ID">
<textarea id="cancelReason" placeholder="Reason for cancellation (required)"></textarea>

<button onclick="cancelOrder()">Cancel Order</button>
</div>

<!-- LAST ORDER -->
<div class="section">
<div id="lastOrderBox"></div>
</div>

<script>

const token="YOUR_BOT_TOKEN";
const chat_id="YOUR_CHAT_ID";

let cart=[];

/* ADD TO CART */
function addToCart(name,size,price){

let existing=cart.find(item=>item.name===name && item.size===size);

if(existing){
existing.qty++;
}else{
cart.push({name,size,price,qty:1});
}

updateCart();
}

/* UPDATE CART */
function updateCart(){

let cartDiv=document.getElementById("cartItems");
cartDiv.innerHTML="";
let total=0;

cart.forEach((item,index)=>{

let subtotal=item.price*item.qty;
total+=subtotal;

cartDiv.innerHTML+=`
<div class="cart-item">
${item.name} (${item.size})  
<br>
Qty: 
<button onclick="changeQty(${index},-1)">-</button>
${item.qty}
<button onclick="changeQty(${index},1)">+</button>
<br>
Subtotal: ${subtotal} MMK
<br>
<button class="remove-btn" onclick="removeItem(${index})">Remove</button>
</div>
`;
});

document.getElementById("cartTotal").innerText=total;
}

/* CHANGE QTY */
function changeQty(index,amount){
cart[index].qty+=amount;
if(cart[index].qty<=0){
cart.splice(index,1);
}
updateCart();
}

/* REMOVE ITEM */
function removeItem(index){
cart.splice(index,1);
updateCart();
}

/* PAYMENT METHOD CHANGE */
function handlePaymentChange(){
let method=document.getElementById("paymentMethod").value;
let qrBox=document.getElementById("kbzQRBox");

if(method==="kbz"){
qrBox.style.display="block";
}else{
qrBox.style.display="none";
}
}

/* SEND ORDER */
function sendOrder(){

if(cart.length===0){
alert("Cart is empty");
return;
}

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const address=document.getElementById("address").value;
const payment=document.getElementById("paymentMethod").value;

if(!name||!phone||!address||!payment){
alert("Fill all fields");
return;
}

if(payment==="kbz"){
let screenshot=document.getElementById("paymentScreenshot").files[0];
if(!screenshot){
alert("Upload payment screenshot");
return;
}
}

const orderId="ORD"+Date.now();

let itemsText="";
cart.forEach(item=>{
itemsText+=`${item.name} (${item.size}) x${item.qty} = ${item.price*item.qty} MMK\n`;
});

let total=document.getElementById("cartTotal").innerText;

let message=`🛒 NEW ORDER

Order ID: ${orderId}

${itemsText}
Total: ${total} MMK

Payment: ${payment}

Name: ${name}
Phone: ${phone}
Address: ${address}`;

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:chat_id,
text:message
})
});

localStorage.setItem("lastOrder",JSON.stringify({
orderId:orderId,
items:itemsText,
total:total
}));

alert("Order placed! Your Order ID: "+orderId);

cart=[];
updateCart();
displayLastOrder();
}

/* CANCEL ORDER */
function cancelOrder(){

let orderId=document.getElementById("cancelOrderId").value;
let reason=document.getElementById("cancelReason").value;

if(!orderId||!reason){
alert("Order ID and reason required");
return;
}

let message=`❌ ORDER CANCEL REQUEST

Order ID: ${orderId}

Reason:
${reason}`;

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:chat_id,
text:message
})
});

alert("Cancel request sent.");
}

/* DISPLAY LAST ORDER */
function displayLastOrder(){

const data=localStorage.getItem("lastOrder");
if(!data) return;

const order=JSON.parse(data);

document.getElementById("lastOrderBox").innerHTML=`
<h3>📦 Your Last Order</h3>
<b>Order ID:</b> ${order.orderId}<br><br>
<pre>${order.items}</pre>
<b>Total:</b> ${order.total} MMK
`;
}

window.onload=function(){
displayLastOrder();
};

</script>

</body>
</html>
