<!-- MY ORDERS PAGE SECTION -->
<div id="page-orders" class="page">
    <div class="section">
        <h2 style="color:var(--primary); letter-spacing: 2px; text-align:center;">CUSTOMER PORTAL</h2>
        
        <!-- LOGIN VIEW -->
        <div id="login-view" style="display:none; text-align:center; padding: 20px 0;">
            <p style="opacity:0.7; font-size: 14px; margin-bottom: 20px;">Login with your phone or email to track orders.</p>
            
            <div style="max-width: 320px; margin: auto;">
                <input id="lookup-input" type="text" placeholder="Email or Phone Number" style="text-align:center;">
                <button class="btn" onclick="dualLookup()" style="margin-top: 15px;">Access My Account</button>
            </div>
            
            <p style="font-size: 11px; opacity:0.4; margin-top: 20px;">By logging in, you agree to GOTCHA's terms of service.</p>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="orders-view" style="display:none;">
            <div id="account-header" style="margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px;">
                <span id="user-display" style="font-size: 12px; color: var(--primary); font-weight: bold;"></span>
            </div>
            
            <div id="resultsList">
                <p style="opacity:0.5">Syncing your wardrobe...</p>
            </div>
            
            <button class="btn" style="background:#222; color:white; border: 1px solid #444; margin-top:30px; font-size: 11px;" onclick="signOut()">
                Switch Account
            </button>
        </div>
    </div>
</div>

<script>
// --- IDENTITY LOGIC ---

window.onload = () => {
    updateCartUI(); 
    checkSession();
};

function checkSession() {
    const savedID = localStorage.getItem("gotchaUserID");
    
    if (savedID) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('orders-view').style.display = 'block';
        document.getElementById('user-display').innerText = "ACCOUNT: " + savedID;
        fetchCustomerData(savedID); 
    } else {
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('orders-view').style.display = 'none';
    }
}

function dualLookup() {
    const input = document.getElementById('lookup-input').value.trim();
    if(input.length < 5) return alert("Please enter a valid email or phone number.");
    
    // Save locally so they don't have to login again
    localStorage.setItem("gotchaUserID", input);
    checkSession();
}

function signOut() {
    if(confirm("Are you sure you want to log out?")) {
        localStorage.removeItem("gotchaUserID");
        location.reload();
    }
}

// --- AIRTABLE DUAL-SEARCH ENGINE ---
async function fetchCustomerData(identity) {
    const list = document.getElementById("resultsList");
    
    // This formula checks BOTH the Phone and Email columns in Airtable
    const formula = `OR({Phone}='${identity}', {Email}='${identity}')`;
    const url = `https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}?filterByFormula=${encodeURIComponent(formula)}`;
    
    try {
        const res = await fetch(url, { headers: { Authorization: `Bearer ${CONFIG.airtableToken}` } });
        const data = await res.json();
        
        if(!data.records || data.records.length === 0) {
            list.innerHTML = `
                <div style="text-align:center; padding: 40px 0; opacity: 0.5;">
                    <p>No orders found for this ID.</p>
                    <small>Make sure you use the same info you provided at checkout.</small>
                </div>`;
            return;
        }

        // Display results beautifully
        list.innerHTML = data.records.sort((a,b) => new Date(b.createdTime) - new Date(a.createdTime)).map(r => `
            <div style="background:#1a1a1a; padding:18px; border-radius:12px; margin-bottom:12px; border:1px solid #333;">
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <div style="font-weight:bold; font-size:14px; letter-spacing:1px;">${r.fields.OrderID}</div>
                        <div style="font-size:11px; opacity:0.5; margin-top:4px;">${new Date(r.createdTime).toLocaleDateString()}</div>
                    </div>
                    <span style="background:var(--primary); color:black; font-size:9px; padding:4px 10px; border-radius:50px; font-weight:bold; text-transform:uppercase;">
                        ${r.fields.Status || 'Pending'}
                    </span>
                </div>
                <div style="font-size:13px; margin-top:15px; padding-top:15px; border-top:1px solid #222; opacity:0.8;">
                    ${r.fields.Items}
                </div>
            </div>
        `).join('');
    } catch(e) { 
        list.innerHTML = "<p style='color:red;'>Sync Error. Please check your connection.</p>"; 
    }
}

// --- UPDATED CHECKOUT (To Support Dual Login) ---
async function sendOrder() {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const address = document.getElementById("address").value;

    if(!name || !phone || !address) return alert("Phone and Shipping Address are required.");

    // Tag the user for future auto-login (prefers Phone, falls back to Email)
    localStorage.setItem("gotchaUserID", phone || email);

    const orderId = "GTC-" + Math.floor(1000 + Math.random() * 9000);
    const itemsSummary = cart.map(i => `${i.name}(${i.size})x${i.qty}`).join(", ");

    try {
        await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}`, {
            method: "POST",
            headers: { Authorization: `Bearer ${CONFIG.airtableToken}`, "Content-Type": "application/json" },
            body: JSON.stringify({ fields: { 
                OrderID: orderId, 
                CustomerName: name, 
                Email: email, 
                Phone: phone, 
                Address: address, 
                Items: itemsSummary, 
                Status: "Pending" 
            } })
        });

        alert("Order Successful!");
        cart = []; 
        localStorage.setItem("gotchaCart", "[]");
        window.location.reload(); 
    } catch(e) { alert("Failed to process order."); }
}
</script>
