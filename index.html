<!-- MY ORDERS PAGE -->
<div id="page-orders" class="page">
    <div class="section">
        <h2>My Dashboard</h2>
        
        <!-- This part shows if we DON'T know who they are yet -->
        <div id="login-view" style="display:none; text-align:center;">
            <p style="opacity:0.7;">Enter your phone number to see your order history.</p>
            <input id="lookup-phone" type="text" placeholder="09xxxxxxxxx">
            <button class="btn" onclick="manualLookup()">View My Orders</button>
        </div>

        <!-- This part shows their orders -->
        <div id="resultsList">
            <p style="opacity:0.5">Checking for saved account...</p>
        </div>
        
        <button id="logout-btn" class="btn" style="display:none; background:#333; color:white; margin-top:20px;" onclick="clearMemory()">Not you? Switch Account</button>
    </div>
</div>

<script>
// --- NO CHANGES TO YOUR CONFIG ---
const CONFIG = {
    token: "8631368822:AAHY31uXLftZJjFjXlSiUJszeiMj2hPu6Ik",
    chatId: "7194426571",
    airtableBase: "appG57X3qkk4A5IHP",
    airtableToken: "patChpUg2SUHRGuIh.f98b61f7e06b47534f6e53c55f9fe4469999eb57eec3a23d0b4a4e6a685f4b06",
    airtableTable: "Orders"
};

// --- 1. THE AUTO-MEMORY LOGIC ---
window.onload = () => {
    updateCartUI(); // Keep your cart working
    checkIdentity();
};

function checkIdentity() {
    const savedPhone = localStorage.getItem("gotchaUserPhone");
    if (savedPhone) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('logout-btn').style.display = 'block';
        trackOrders(savedPhone); // Pulls from your Airtable
    } else {
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('resultsList').innerHTML = "";
    }
}

// --- 2. THE MANUAL LOOKUP (If they switch phones) ---
function manualLookup() {
    const phone = document.getElementById('lookup-phone').value;
    if(!phone) return alert("Please enter your phone number");
    
    localStorage.setItem("gotchaUserPhone", phone);
    checkIdentity();
}

function clearMemory() {
    if(confirm("Sign out from this device?")) {
        localStorage.removeItem("gotchaUserPhone");
        location.reload();
    }
}

// --- 3. YOUR EXISTING SEND ORDER FUNCTION (Updated to "Tag" them) ---
async function sendOrder() {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value; // THE KEY
    const address = document.getElementById("address").value;
    const email = document.getElementById("email").value;

    if(!name || !phone || !address) return alert("Fill in details");

    // This is the "Magic" part - save it for next time!
    localStorage.setItem("gotchaUserPhone", phone);

    const orderId = "GTC-" + Math.floor(1000 + Math.random() * 9000);
    const itemsSummary = cart.map(i => `${i.name}(${i.size})x${i.qty}`).join(", ");

    try {
        // Your existing Airtable Post
        await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}`, {
            method: "POST",
            headers: { Authorization: `Bearer ${CONFIG.airtableToken}`, "Content-Type": "application/json" },
            body: JSON.stringify({ fields: { OrderID: orderId, CustomerName: name, Email: email, Phone: phone, Address: address, Items: itemsSummary, Status: "Pending" } })
        });

        alert("Order Success!");
        cart = []; localStorage.setItem("gotchaCart", "[]");
        window.location.reload(); // Refresh to show the new order in Dashboard
    } catch(e) { alert("Error"); }
}

// --- YOUR EXISTING TRACKING FUNCTION ---
async function trackOrders(phone) {
    const list = document.getElementById("resultsList");
    list.innerHTML = "Fetching orders...";
    
    const url = `https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}?filterByFormula={Phone}='${encodeURIComponent(phone)}'`;
    
    try {
        const res = await fetch(url, { headers: { Authorization: `Bearer ${CONFIG.airtableToken}` } });
        const data = await res.json();
        
        if(!data.records || data.records.length === 0) {
            list.innerHTML = "<p style='opacity:0.5'>No orders found for this number.</p>";
            return;
        }

        list.innerHTML = data.records.map(r => `
            <div style="background:#222; padding:15px; border-radius:10px; margin-bottom:10px; border-left:4px solid var(--primary);">
                <div style="display:flex; justify-content:space-between;">
                    <strong>${r.fields.OrderID}</strong>
                    <span style="color:var(--primary); font-size:12px;">${r.fields.Status || 'Pending'}</span>
                </div>
                <small style="opacity:0.6;">${r.fields.Items}</small>
            </div>
        `).join('');
    } catch(e) { list.innerHTML = "Error loading history."; }
}
</script>
