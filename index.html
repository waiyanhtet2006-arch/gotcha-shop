<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GOTCHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f0f0f;
  color:white;
}

.container{
  width:95%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:30px;
  letter-spacing:2px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:25px;
}

.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}

.card img{
  width:100%;
  border-radius:8px;
  margin-bottom:15px;
}

.card select,.card input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:#00bfa6;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#00a08d;
}

.checkout{
  margin-top:40px;
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
}

.checkout input, .checkout select{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:none;
}

.qr-box{
  text-align:center;
  margin-top:15px;
  display:none;
}

.qr-box img{
  width:200px;
  margin-top:10px;
}

.total-box{
  margin-top:15px;
  font-size:18px;
}

.success{
  display:none;
  text-align:center;
  padding:40px;
}
</style>
</head>
<body>

<div class="container">

<h1>GOTCHA</h1>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/500x500" />
<h3>CULTURAL TREASURE (WHITE)</h3>
<p>48,000 MMK</p>
<select id="size1">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
</select>
<input type="number" id="qty1" value="1" min="1">
<button onclick="selectProduct('White',48000,'size1','qty1')">Select This</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/500x500" />
<h3>CULTURAL TREASURE (BLACK)</h3>
<p>48,000 MMK</p>
<select id="size2">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
</select>
<input type="number" id="qty2" value="1" min="1">
<button onclick="selectProduct('Black',48000,'size2','qty2')">Select This</button>
</div>

</div>

<div class="checkout" id="orderSection">
<h2>Checkout</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="address" placeholder="Delivery Address">

<select id="township" onchange="calculateShipping()">
<option value="">Choose Township</option>
<option value="2000">Yangon - 2000 MMK</option>
<option value="3000">Mandalay - 3000 MMK</option>
<option value="4000">Other - 4000 MMK</option>
</select>

<select id="payment" onchange="paymentChange()">
<option value="">Select Payment Type</option>
<option value="COD">Cash on Delivery</option>
<option value="KBZ Pay">KBZ Pay</option>
</select>

<div class="qr-box" id="qrBox">
<p>Scan KBZ Pay QR</p>
<img src="YOUR_QR_RAW_LINK">
<input type="file" id="paymentScreenshot" accept="image/*">
</div>

<div class="total-box">
<p>Shipping: <span id="shipping">0</span> MMK</p>
<p>Total: <span id="total">0</span> MMK</p>
</div>

<button onclick="sendOrder()">Confirm Order</button>

</div>

<div class="success" id="successSection">
<h2>Order Successful!</h2>
<p>Your Order ID:</p>
<h3 id="displayOrderId"></h3>
</div>

</div>

<script>
let selectedProduct=null;
let productPrice=0;

const token="YOUR_BOT_TOKEN";
const chat_id="YOUR_CHAT_ID";

function selectProduct(name,price,sizeId,qtyId){
  const size=document.getElementById(sizeId).value;
  const qty=parseInt(document.getElementById(qtyId).value);

  if(!size){
    alert("Please select size.");
    return;
  }

  selectedProduct=name+" - Size: "+size+" x"+qty;
  productPrice=price*qty;
  calculateShipping();
}

function calculateShipping(){
  const ship=parseInt(document.getElementById("township").value)||0;
  document.getElementById("shipping").innerText=ship;
  document.getElementById("total").innerText=productPrice+ship;
}

function paymentChange(){
  const pay=document.getElementById("payment").value;
  document.getElementById("qrBox").style.display=
    pay==="KBZ Pay"?"block":"none";
}

async function sendOrder(){

if(!selectedProduct){
  alert("Please select product.");
  return;
}

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const address=document.getElementById("address").value;
const township=document.getElementById("township").value;
const payment=document.getElementById("payment").value;
const shipping=document.getElementById("shipping").innerText;
const total=document.getElementById("total").innerText;

if(!name||!phone||!address||!township||!payment){
  alert("Please fill all fields.");
  return;
}

const orderId="ORD"+Date.now();

const message=
"New Order\n\n"+
"Order ID: "+orderId+"\n"+
"Product: "+selectedProduct+"\n"+
"Name: "+name+"\n"+
"Phone: "+phone+"\n"+
"Address: "+address+"\n"+
"Shipping: "+shipping+"\n"+
"Total: "+total+"\n"+
"Payment: "+payment;

try{

if(payment==="KBZ Pay"){

const fileInput=document.getElementById("paymentScreenshot");
if(!fileInput.files[0]){
  alert("Upload payment screenshot.");
  return;
}

const formData=new FormData();
formData.append("chat_id",chat_id);
formData.append("photo",fileInput.files[0]);
formData.append("caption",message);

await fetch(`https://api.telegram.org/bot${token}/sendPhoto`,{
method:"POST",
body:formData
});

}else{

await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id:chat_id,text:message})
});

}

document.getElementById("orderSection").style.display="none";
document.getElementById("successSection").style.display="block";
document.getElementById("displayOrderId").innerText=orderId;

}catch(error){
alert("Error sending order.");
}

}
</script>

</body>
</html>
