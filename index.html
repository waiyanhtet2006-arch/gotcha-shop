<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOTCHA PRIME</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

    <script>
        const CONFIG = {
            telegramToken: "8631368822:AAHY31uXLftZJjFjXlSiUJszeiMj2hPu6Ik",
            telegramChatId: "7194426571",
            airtableToken: "PatpzEmXn2kzhAh0d.acdfefca3cd73828e1100481f7d731963b6aad2d6ea905ba1b58ac491f9e1ca3",
            airtableBaseId: "appG57X3qkk4A5IHP",
            airtableTableName: "Orders"
        };

        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            alert("Added to cart!");
        }

        async function handleOrder(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "SENDING...";

            // Matches your columns in image_20.png, image_21.png, image_22.png
            const orderData = {
                OrderID: "ORD-" + Math.floor(Math.random() * 1000),
                CustomerName: document.getElementById('cust_name').value,
                Phone: document.getElementById('cust_phone').value,
                Address: document.getElementById('cust_address').value,
                Items: cart.map(i => i.name).join(", "),
                Total: cart.reduce((sum, i) => sum + i.price, 0),
                Status: "Pending"
            };

            try {
                // 1. POST TO AIRTABLE
                const response = await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBaseId}/${CONFIG.airtableTableName}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.airtableToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ fields: orderData })
                });

                // 2. SEND TO TELEGRAM
                const msg = `🔔 NEW ORDER!\nName: ${orderData.CustomerName}\nTotal: $${orderData.Total}`;
                await fetch(`https://api.telegram.org/bot${CONFIG.telegramToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CONFIG.telegramChatId, text: msg })
                });

                if (response.ok) {
                    alert("Order Successful! Check Airtable.");
                } else {
                    const errData = await response.json();
                    alert("Error: " + errData.error.message);
                }
            } catch (err) {
                alert("Connection failed.");
            } finally {
                btn.innerText = "PLACE ORDER NOW";
            }
        }
    </script>

    <div class="p-10 text-center">
        <button onclick="addToCart('Jersey', 25)" class="bg-black text-white p-4 rounded">Add Jersey ($25)</button>
        
        <form onsubmit="handleOrder(event)" class="mt-10 space-y-4 max-w-sm mx-auto">
            <input id="cust_name" placeholder="Full Name" required class="w-full border p-2">
            <input id="cust_phone" placeholder="Phone" required class="w-full border p-2">
            <textarea id="cust_address" placeholder="Address" required class="w-full border p-2"></textarea>
            <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white p-4 font-bold">PLACE ORDER NOW</button>
        </form>
    </div>
</body>
</html>
