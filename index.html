<div id="collections" class="products">
    <div class="card">
        <img id="mainProductImage" src="https://i.ibb.co/LdsXqW7/image-35.png" alt="Cultural Treasure">
        <h3 id="displayTitle">CULTURAL TREASURE (BLACK)</h3>
        <p style="font-weight: bold; color: var(--primary); margin-top: 10px;">
            <span id="displayPrice">48,000</span> MMK
        </p>

        <div style="margin-top: 15px;">
            <label style="font-size: 12px; color: var(--text-secondary); text-transform: uppercase;">Select Color</label>
            <select id="colorSelect" onchange="updateProductVariant()">
                <option value="Black" data-img="https://i.ibb.co/LdsXqW7/image-35.png" data-price="48000">Black</option>
                <option value="White" data-img="https://i.ibb.co/LdsXqW7/image-36.png" data-price="48000">White</option>
            </select>
        </div>

        <div style="margin-top: 10px;">
            <label style="font-size: 12px; color: var(--text-secondary); text-transform: uppercase;">Select Size</label>
            <select id="sizeSelect">
                <option value="">Choose Size</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
            </select>
        </div>

        <button class="btn" onclick="addUnifiedToCart()">Add To Cart</button>
    </div>
</div>

<script>
// Function to switch photos and text based on selected color
function updateProductVariant() {
    const selector = document.getElementById('colorSelect');
    const selectedOption = selector.options[selector.selectedIndex];
    
    const newImg = selectedOption.getAttribute('data-img');
    const newPrice = selectedOption.getAttribute('data-price');
    const colorName = selectedOption.value;

    // Update UI Elements
    document.getElementById('mainProductImage').src = newImg;
    document.getElementById('displayTitle').innerText = `CULTURAL TREASURE (${colorName.toUpperCase()})`;
    document.getElementById('displayPrice').innerText = parseInt(newPrice).toLocaleString();
}

// Updated Add to Cart logic to handle the dynamic selection
function addUnifiedToCart() {
    const color = document.getElementById('colorSelect').value;
    const size = document.getElementById('sizeSelect').value;
    const price = 48000; // Standard price for this collection

    if (!size) {
        alert("Please select a size first.");
        return;
    }

    const itemName = `Cultural Treasure (${color})`;
    
    // Uses your existing cart logic
    const existing = cart.find(i => i.name === itemName && i.size === size);
    if (existing) {
        existing.qty++;
    } else {
        cart.push({ name: itemName, size: size, price: price, qty: 1 });
    }
    
    saveAndRefresh();
    showToast(`${color} item added to cart`);
}
</script>
