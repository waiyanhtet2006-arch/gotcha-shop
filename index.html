<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOTCHA PRIME - Final Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cart-count { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- CONFIGURATION -->
    <script>
        const CONFIG = {
            telegramToken: "8631368822:AAHY31uXLftZJjFjXlSiUJszeiMj2hPu6Ik",
            telegramChatId: "7194426571",
            airtableToken: "patChpUg2SUHRGuIh.f98b61f7e06b47534f6e53c55f9fe4469999eb57eec3a23d0b4a4e6a685f4b06",
            airtableBaseId: "appG57X3qkk4A5IHP",
            airtableTableName: "Orders"
        };
    </script>

    <!-- NAVIGATION -->
    <nav class="bg-black text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold tracking-widest">GOTCHA PRIME</h1>
        <div class="relative cursor-pointer bg-gray-800 p-2 rounded-full" onclick="toggleCart()">
            🛒 <span id="cart-count" class="cart-count">0</span>
        </div>
    </nav>

    <!-- PRODUCT DISPLAY -->
    <main class="p-6 max-w-4xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center text-center">
            <h2 class="text-2xl font-bold text-gray-800">Prime Test Jersey</h2>
            <p class="text-blue-600 font-semibold text-lg mt-1">$25.00</p>
            <button onclick="addToCart('Prime Test Jersey', 25)" class="mt-6 w-full max-w-xs bg-black text-white py-3 rounded-lg font-bold hover:bg-gray-800 transition shadow-md">
                ADD TO CART
            </button>
        </div>
    </main>

    <!-- CART & CHECKOUT MODAL -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black">YOUR CART</h2>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-black text-xl">✕</button>
            </div>
            
            <div id="cart-items" class="space-y-3 mb-6 border-b pb-4"></div>
            
            <form id="order-form" onsubmit="handleOrder(event)" class="space-y-4 pt-4">
                <input type="text" id="name" placeholder="Full Name" required class="w-full border p-3 rounded-xl">
                <input type="text" id="phone" placeholder="Phone Number" required class="w-full border p-3 rounded-xl">
                <textarea id="address" placeholder="Shipping Address" required class="w-full border p-3 rounded-xl h-20"></textarea>
                
                <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold hover:bg-green-700 transition">
                    PLACE ORDER NOW
                </button>
            </form>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            alert("✅ Added!");
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400">Cart is empty</p>';
            } else {
                let total = cart.reduce((sum, i) => sum + i.price, 0);
                container.innerHTML = cart.map(i => `<div class="flex justify-between"><span>${i.name}</span><span>$${i.price}</span></div>`).join('') + 
                `<div class="flex justify-between font-bold mt-2"><span>Total</span><span>$${total}</span></div>`;
            }
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        async function handleOrder(event) {
            event.preventDefault();
            if (cart.length === 0) return alert("Add items first!");

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "🚀 SENDING...";

            // Matches your columns in image_24.png and image_25.png
            const orderData = {
                OrderID: "GOTCHA-" + Math.floor(Math.random() * 10000),
                CustomerName: document.getElementById('name').value,
                Phone: document.getElementById('phone').value,
                Address: document.getElementById('address').value,
                Items: cart.map(i => i.name).join(", "),
                Total: cart.reduce((sum, i) => sum + i.price, 0),
                Status: "Pending"
            };

            try {
                // 1. SAVE TO AIRTABLE
                const response = await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBaseId}/${CONFIG.airtableTableName}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.airtableToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ fields: orderData })
                });

                // 2. SEND TO TELEGRAM
                const msg = `🔔 NEW ORDER\nName: ${orderData.CustomerName}\nTotal: $${orderData.Total}\nItems: ${orderData.Items}`;
                await fetch(`https://api.telegram.org/bot${CONFIG.telegramToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CONFIG.telegramChatId, text: msg })
                });

                if (response.ok) {
                    alert("🎉 SUCCESS! Row added to Airtable.");
                    cart = [];
                    updateCartUI();
                    toggleCart();
                    document.getElementById('order-form').reset();
                } else {
                    const err = await response.json();
                    alert("Airtable Error: " + err.error.message);
                }
            } catch (error) {
                alert("Connection error.");
            } finally {
                btn.disabled = false;
                btn.innerText = "PLACE ORDER NOW";
            }
        }
    </script>
</body>
</html>
