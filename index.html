<header>
    <h1>GOTCHA</h1>
    <div class="menu-icon" onclick="toggleMenu()" style="cursor:pointer; font-size: 24px;">☰</div>
    <nav class="nav-bar" id="drawer">
        <span class="nav-link" onclick="switchPage('shop')">Home / Shop</span>
        <span class="nav-link" onclick="switchPage('orders')">Track Order</span>
        <span class="nav-link" id="authBtn" onclick="handleAuth()">Sign In</span>
    </nav>
</header>

<div id="page-shop" class="page active">
    <!-- Hero Section -->
    <div class="hero">
        <div class="hero-content">
            <p>URBAN EDGE</p>
            <h2>Jackets for the<br>Modern Man</h2>
            <button class="btn" onclick="document.getElementById('arrivals').scrollIntoView()">Discovery Now</button>
        </div>
    </div>

    <div class="container" id="arrivals">
        <h2 class="section-title">New Arrivals</h2>
        
        <!-- Existing Product Grid -->
        <div class="products">
            <div class="card">
                <img src="https://i.ibb.co/LdsXqW7/image-36.png">
                <h3>CULTURAL TREASURE (WHITE)</h3>
                <p>48,000 MMK</p>
                <select id="size1" style="border:1px solid #ddd; margin-bottom:10px;"><option value="">Size</option><option>S</option><option>M</option><option>L</option></select>
                <button class="btn" onclick="addToCart('White Tee', 48000, 'size1')">Add To Cart</button>
            </div>
            <!-- Repeat for other items -->
        </div>

        <!-- Banner Grid (Bottom) -->
        <div class="banner-grid">
            <div class="banner-item" style="background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1920');">
                <p>ETHEREAL ELEGANCE</p>
                <h3>Where Dreams Meet Couture</h3>
                <button class="btn" style="width:fit-content;">Shop Now</button>
            </div>
            <div class="banner-item" style="background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1581044777550-4cfa60707c03?q=80&w=1886');">
                <p>RADIANT REVERIE</p>
                <h3>Styles for Every Woman</h3>
                <button class="btn" style="width:fit-content;">Shop Now</button>
            </div>
        </div>

        <!-- Your Cart Section (Existing) -->
        <div class="section" style="margin-top:100px; border-top:1px solid #eee;">
            <h2>Your Cart</h2>
            <div id="cartItems"></div>
            <h3>Total: <span id="cartTotal">0</span> MMK</h3>
            <div style="max-width:500px; margin-top:20px;">
                <input id="name" placeholder="Full Name">
                <input id="phone" placeholder="Phone Number">
                <textarea id="address" placeholder="Shipping Address"></textarea>
                <button class="btn" id="confirmBtn" onclick="sendOrder()" style="width:100%; margin-top:10px;">Confirm Order</button>
            </div>
        </div>
    </div>
</div>

<!-- Keep your Page-Orders div and all Scripts exactly as they were -->
