<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GOTCHA | Official Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
--primary:#d4af37; 
--bg:#0f0f0f;
--card-bg:#1a1a1a;
--text:#ffffff;
--danger:#ff4d4d;
--success:#00bfa6;
}
body{margin:0;font-family:'Segoe UI',Roboto,Arial;background:var(--bg);color:var(--text); line-height: 1.6;}
.container{width:95%;max-width:1100px;margin:auto;padding:20px;}

header{text-align:center; padding: 40px 0;}
h1{color:var(--primary); letter-spacing: 0.5em; font-weight: bold; margin-bottom: 20px;}
.nav-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px; flex-wrap: wrap;}
.nav-link { color: white; text-decoration: none; font-size: 11px; cursor: pointer; opacity: 0.4; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;}
.nav-link.active { opacity: 1; border-bottom: 2px solid var(--primary); padding-bottom: 5px;}

.page { display: none; animation: fadeIn 0.4s ease; }
.page.active { display: block; }
.section{background:var(--card-bg);padding:30px;border-radius:16px; margin-top: 20px; border: 1px solid #222;}

/* Products */
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;}
.card{background:var(--card-bg);padding:20px;border-radius:16px;border:1px solid #333; text-align: center;}
.card img{width:100%; border-radius:10px;}

/* Cart Controls */
.qty-controls { display: flex; align-items: center; gap: 10px; }
.qty-btn { background: #333; color: white; border: 1px solid #444; border-radius: 4px; padding: 2px 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
.qty-btn:hover { background: var(--primary); color: black; }

.order-record { background: #222; padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid var(--primary); }
.status-badge { padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
.status-pending { background: #444; color: white; }
.status-accepted { background: #b8860b; color: white; }
.status-delivered { background: var(--success); color: black; }

select,input,textarea{width:100%;padding:14px;margin-top:10px;background:#222;border:1px solid #444;border-radius:10px;color:white; box-sizing: border-box;}
.btn{background:var(--primary);color:black;width:100%;margin-top:15px;padding:15px;border:none;border-radius:10px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;}

@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<body>

<div id="toast" style="position:fixed;bottom:20px;right:20px;background:var(--primary);color:black;padding:15px;border-radius:8px;display:none;z-index:1000; font-weight: bold;">Updated 📦</div>

<div class="container">
    <header>
        <h1>GOTCHA</h1>
        <div class="nav-bar">
            <span class="nav-link active" id="link-shop" onclick="switchPage('shop')">Shop</span>
            <span class="nav-link" id="link-orders" onclick="switchPage('orders')">My Orders</span>
            <span class="nav-link" id="authBtn" onclick="handleAuth()">Sign In</span>
        </div>
    </header>

    <!-- SHOP PAGE -->
    <div id="page-shop" class="page active">
        <div class="products">
            <div class="card">
                <img src="https://i.ibb.co/LdsXqW7/image-36.png">
                <h3>CULTURAL TREASURE (WHITE)</h3>
                <p>48,000 MMK</p>
                <select id="size1"><option value="">Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
                <button class="btn" onclick="addToCart('White Tee', 48000, 'size1')">Add To Cart</button>
            </div>
            <div class="card">
                <img src="https://i.ibb.co/LdsXqW7/image-35.png">
                <h3>CULTURAL TREASURE (BLACK)</h3>
                <p>48,000 MMK</p>
                <select id="size2"><option value="">Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
                <button class="btn" onclick="addToCart('Black Tee', 48000, 'size2')">Add To Cart</button>
            </div>
        </div>

        <div class="section">
            <h2>Your Cart</h2>
            <div id="cartItems"></div>
            <h3 style="text-align:right; border-top: 1px solid #333; padding-top: 15px;">Total: <span id="cartTotal">0</span> MMK</h3>
            
            <div style="margin-top:30px;">
                <h3>Checkout</h3>
                <input id="name" placeholder="Full Name">
                <input id="phone" placeholder="Phone Number">
                <input id="email_hidden" type="hidden" value="">
                <textarea id="address" placeholder="Shipping Address"></textarea>
                <button class="btn" id="confirmBtn" onclick="sendOrder()">Confirm Order</button>
            </div>
        </div>
    </div>

    <!-- ORDERS PAGE -->
    <div id="page-orders" class="page">
        <div class="section">
            <h2>My Dashboard</h2>
            <div id="resultsList">
                <p style="opacity:0.5">No orders found. History will appear here once you place an order.</p>
            </div>
        </div>
    </div>
</div>

<!-- FIREBASE AUTHENTICATION -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAj7skSFoyw5U8yqZG6N-AoX0aNvY6Xzqo",
  authDomain: "gotcha-official.firebaseapp.com",
  projectId: "gotcha-official",
  storageBucket: "gotcha-official.firebasestorage.app",
  messagingSenderId: "301647267739",
  appId: "1:301647267739:web:1adabbb3f3b49eeb6a433e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

onAuthStateChanged(auth, (user) => {
    const authBtn = document.getElementById('authBtn');
    if (user) {
        authBtn.innerText = `LOGOUT (${user.displayName.split(' ')[0]})`;
        document.getElementById('name').value = user.displayName;
        document.getElementById('email_hidden').value = user.email;
        // Search by email first if signed in
        trackOrders(user.email, "Email");
    } else {
        authBtn.innerText = "SIGN IN";
        document.getElementById('email_hidden').value = "";
        const savedPhone = localStorage.getItem("gotchaUserPhone");
        if(savedPhone) trackOrders(savedPhone, "Phone");
    }
});

window.handleAuth = async () => {
    if (auth.currentUser) {
        await signOut(auth);
        location.reload();
    } else {
        try { await signInWithPopup(auth, provider); } catch(e) { console.error(e); }
    }
};
</script>

<script>
const CONFIG={
    token: "8631368822:AAHY31uXLftZJjFjXlSiUJszeiMj2hPu6Ik",
    chatId: "7194426571",
    airtableBase: "appG57X3qkk4A5IHP",
    airtableToken: "patChpUg2SUHRGuIh.f98b61f7e06b47534f6e53c55f9fe4469999eb57eec3a23d0b4a4e6a685f4b06",
    airtableTable: "Orders"
};

let cart=JSON.parse(localStorage.getItem("gotchaCart"))||[];

function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('link-' + page).classList.add('active');
    
    if(page === 'orders') {
        const email = document.getElementById('email_hidden').value;
        const savedPhone = localStorage.getItem("gotchaUserPhone");
        if(email) trackOrders(email, "Email");
        else if(savedPhone) trackOrders(savedPhone, "Phone");
    }
}

function updateQty(index, change) {
    cart[index].qty += change;
    if(cart[index].qty < 1) {
        if(confirm("Remove this item?")) { cart.splice(index, 1); } 
        else { cart[index].qty = 1; }
    }
    saveAndRefresh();
}

function addToCart(name,price,sizeId){
    const size=document.getElementById(sizeId).value;
    if(!size){alert("Select size");return;}
    const existing=cart.find(i=>i.name===name && i.size===size);
    if(existing){existing.qty++;}else{ cart.push({name,size,price,qty:1}); }
    saveAndRefresh();
    showToast("Added to cart");
}

function saveAndRefresh(){ 
    localStorage.setItem("gotchaCart",JSON.stringify(cart)); 
    updateCartUI(); 
}

function updateCartUI(){
    const div=document.getElementById("cartItems");
    div.innerHTML="";
    let total=0;
    cart.forEach((item,index)=>{
        total+=item.price*item.qty;
        div.innerHTML+=`
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid #222;">
            <div>
                <div style="font-weight:bold;">${item.name}</div>
                <div style="font-size:12px; color:var(--primary);">Size: ${item.size}</div>
            </div>
            <div class="qty-controls">
                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                <span style="min-width:20px; text-align:center;">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
            </div>
        </div>`;
    });
    document.getElementById("cartTotal").innerText=total.toLocaleString();
}

async function trackOrders(identifier, fieldName = "Phone") {
    const list = document.getElementById("resultsList");
    try {
        const url = `https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}?filterByFormula={${fieldName}}='${encodeURIComponent(identifier)}'`;
        const res = await fetch(url, { headers: { Authorization: `Bearer ${CONFIG.airtableToken}` } });
        const data = await res.json();
        
        if(!data.records || data.records.length === 0) return;

        list.innerHTML = data.records.sort((a,b) => new Date(b.createdTime) - new Date(a.createdTime)).map(record => {
            const f = record.fields;
            const status = f.Status || 'Pending';
            return `<div class="order-record">
                <div style="display:flex;justify-content:space-between;"><strong>${f.OrderID}</strong><span class="status-badge status-${status.toLowerCase()}">${status}</span></div>
                <div style="font-size:13px;margin-top:10px; opacity:0.8;">Items: ${f.Items}</div>
            </div>`;
        }).join('');
    } catch (e) { console.log("Check error"); }
}

async function sendOrder(){
    const name=document.getElementById("name").value;
    const phone=document.getElementById("phone").value;
    const address=document.getElementById("address").value;
    if(cart.length===0 || !name || !phone || !address){alert("Fill details");return;}
    
    const btn=document.getElementById("confirmBtn");
    btn.disabled=true; btn.innerText="Processing...";
    
    const orderId="GTC-"+Math.floor(1000+Math.random()*9000);
    const itemsSummary=cart.map(i=>`${i.name}(${i.size})x${i.qty}`).join(", ");
    
    try{
        localStorage.setItem("gotchaUserPhone", phone);
        await fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`,{
            method:"POST", headers:{"Content-Type":"application/json"},
            body:JSON.stringify({chat_id:CONFIG.chatId, text:`NEW ORDER: ${orderId}\nName: ${name}\nPhone: ${phone}\nItems: ${itemsSummary}`})
        });
        await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}`,{
            method:"POST", headers:{Authorization:`Bearer ${CONFIG.airtableToken}`, "Content-Type":"application/json"},
            body:JSON.stringify({fields:{OrderID:orderId, CustomerName:name, Phone:phone, Address:address, Items:itemsSummary, Total:parseInt(document.getElementById("cartTotal").innerText.replace(/,/g,'')), Status:"Pending"}})
        });
        alert("Order Successful!"); cart=[]; saveAndRefresh(); switchPage('orders');
    } catch(e) { alert("Error."); }
    btn.disabled=false; btn.innerText="Confirm Order";
}

function showToast(msg){ const t=document.getElementById("toast"); t.innerText=msg; t.style.display="block"; setTimeout(()=>{t.style.display="none";},2000); }

window.onload = () => {
    updateCartUI();
    const savedPhone = localStorage.getItem("gotchaUserPhone");
    if(savedPhone) trackOrders(savedPhone, "Phone");
};
</script>

</body>
</html>
