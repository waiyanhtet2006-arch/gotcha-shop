<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GOTCHA | Official Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
--primary:#d4af37; 
--bg:#0f0f0f;
--card-bg:#1a1a1a;
--text:#ffffff;
--danger:#ff4d4d;
--success:#00bfa6;
}
body{margin:0;font-family:'Segoe UI',Roboto,Arial;background:var(--bg);color:var(--text);}
.container{width:90%;max-width:1100px;margin:auto;padding:20px;}

/* Header & Nav */
header{text-align:center; padding: 40px 0;}
h1{color:var(--primary); letter-spacing: 0.5em; font-weight: bold; margin-bottom: 20px;}
.nav-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px;}
.nav-link { color: white; text-decoration: none; font-size: 14px; cursor: pointer; opacity: 0.6; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px;}
.nav-link.active { opacity: 1; border-bottom: 2px solid var(--primary); padding-bottom: 5px;}

/* Sections */
.page { display: none; }
.page.active { display: block; }
.section{background:var(--card-bg);padding:30px;border-radius:16px; margin-top: 20px; border: 1px solid #222;}

/* Products */
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;}
.card{background:var(--card-bg);padding:20px;border-radius:16px;border:1px solid #333; text-align: center;}
.card img{width:100%; border-radius:10px;}

/* Tracking UI */
.track-input-group { display: flex; gap: 10px; margin: 20px 0; }
.order-record { background: #222; padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid var(--primary); animation: fadeIn 0.5s ease; }
.status-badge { padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
.status-pending { background: #444; color: white; }
.status-accepted { background: #b8860b; color: white; }
.status-delivered { background: var(--success); color: black; }

/* Forms */
select,input,textarea{width:100%;padding:14px;margin-top:10px;background:#222;border:1px solid #444;border-radius:10px;color:white; box-sizing: border-box;}
.btn{background:var(--primary);color:black;width:100%;margin-top:15px;padding:15px;border:none;border-radius:10px; font-weight: bold; cursor: pointer; text-transform: uppercase;}
.btn-small { width: auto; padding: 10px 25px; margin-top: 10px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<body>

<div id="toast" style="position:fixed;bottom:20px;right:20px;background:var(--primary);color:black;padding:15px;border-radius:8px;display:none;z-index:1000;">Item added 📦</div>

<div class="container">
    <header>
        <h1>GOTCHA</h1>
        <div class="nav-bar">
            <span class="nav-link active" id="link-shop" onclick="switchPage('shop')">Shop</span>
            <span class="nav-link" id="link-orders" onclick="switchPage('orders')">My Orders</span>
        </div>
    </header>

    <!-- SHOP PAGE -->
    <div id="page-shop" class="page active">
        <div class="products">
            <div class="card">
                <img src="https://i.ibb.co/LdsXqW7/image-36.png">
                <h3>CULTURAL TREASURE (WHITE)</h3>
                <p>48,000 MMK</p>
                <select id="size1"><option value="">Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
                <button class="btn" onclick="addToCart('White Tee', 48000, 'size1')">Add To Cart</button>
            </div>
            <div class="card">
                <img src="https://i.ibb.co/LdsXqW7/image-35.png">
                <h3>CULTURAL TREASURE (BLACK)</h3>
                <p>48,000 MMK</p>
                <select id="size2"><option value="">Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
                <button class="btn" onclick="addToCart('Black Tee', 48000, 'size2')">Add To Cart</button>
            </div>
        </div>

        <div class="section">
            <h2>Your Cart</h2>
            <div id="cartItems"></div>
            <h3 style="text-align:right">Total: <span id="cartTotal">0</span> MMK</h3>
            <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
            <h3>Checkout</h3>
            <input id="name" placeholder="Full Name">
            <input id="phone" placeholder="Phone Number">
            <textarea id="address" placeholder="Shipping Address"></textarea>
            <button class="btn" id="confirmBtn" onclick="sendOrder()">Confirm Order</button>
        </div>
    </div>

    <!-- ORDERS TRACKING PAGE -->
    <div id="page-orders" class="page">
        <div class="section">
            <h2>Order Tracking</h2>
            <p style="opacity:0.7">Enter your phone number to view all your previous and current orders.</p>
            <div class="track-input-group">
                <input id="trackPhone" placeholder="Your Phone (e.g. 09...)">
                <button class="btn btn-small" onclick="trackOrders()">Search</button>
            </div>
            <div id="trackingResults"></div>
        </div>
    </div>
</div>

<script>
const CONFIG={
    token: "8631368822:AAHY31uXLftZJjFjXlSiUJszeiMj2hPu6Ik",
    chatId: "7194426571",
    airtableBase: "appG57X3qkk4A5IHP",
    airtableToken: "patChpUg2SUHRGuIh.f98b61f7e06b47534f6e53c55f9fe4469999eb57eec3a23d0b4a4e6a685f4b06",
    airtableTable: "Orders"
};

let cart=JSON.parse(localStorage.getItem("gotchaCart"))||[];

// Navigation
function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('link-' + page).classList.add('active');
}

async function trackOrders() {
    const phone = document.getElementById("trackPhone").value.trim();
    const resultDiv = document.getElementById("trackingResults");
    if(!phone) { alert("Please enter your phone number"); return; }
    resultDiv.innerHTML = "<p>Searching records...</p>";

    try {
        const url = `https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}?filterByFormula={Phone}='${encodeURIComponent(phone)}'`;
        const res = await fetch(url, { headers: { Authorization: `Bearer ${CONFIG.airtableToken}` } });
        const data = await res.json();
        
        if(data.records.length === 0) {
            resultDiv.innerHTML = "<p style='color:var(--danger)'>No records found for this phone number.</p>";
            return;
        }

        resultDiv.innerHTML = data.records.sort((a,b) => new Date(b.createdTime) - new Date(a.createdTime)).map(record => {
            const f = record.fields;
            const status = f.Status || 'Pending';
            return `
                <div class="order-record">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="color:var(--primary); font-weight:bold; letter-spacing:1px;">${f.OrderID}</span>
                        <span class="status-badge status-${status.toLowerCase()}">${status}</span>
                    </div>
                    <div style="margin-top:10px; font-size:14px;">
                        <div style="margin-bottom:5px;"><strong>Items:</strong> ${f.Items}</div>
                        <div style="opacity:0.8 italic">Placed on: ${new Date(record.createdTime).toLocaleDateString()}</div>
                        <div style="text-align:right; font-weight:bold;">${f.Total.toLocaleString()} MMK</div>
                    </div>
                </div>`;
        }).join('');
    } catch (e) { resultDiv.innerHTML = "Error loading. Check connection."; }
}

// Order & Cart Logic
function showToast(msg){ const t=document.getElementById("toast"); t.innerText=msg; t.style.display="block"; setTimeout(()=>{t.style.display="none";},2000); }

function addToCart(name,price,sizeId){
    const size=document.getElementById(sizeId).value;
    if(!size){alert("Select size");return;}
    const existing=cart.find(i=>i.name===name && i.size===size);
    if(existing){existing.qty++;}else{ cart.push({name,size,price,qty:1}); }
    saveAndRefresh();
    showToast("Added to cart");
}

function saveAndRefresh(){ localStorage.setItem("gotchaCart",JSON.stringify(cart)); updateCartUI(); }

function updateCartUI(){
    const div=document.getElementById("cartItems");
    div.innerHTML="";
    let total=0;
    cart.forEach((item,index)=>{
        total+=item.price*item.qty;
        div.innerHTML+=`
        <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #333;">
            <span>${item.name} (${item.size}) x${item.qty}</span>
            <button onclick="removeItem(${index})" style="background:none; border:none; color:var(--danger); cursor:pointer;">Remove</button>
        </div>`;
    });
    document.getElementById("cartTotal").innerText=total.toLocaleString();
}

function removeItem(i){ cart.splice(i,1); saveAndRefresh(); }

async function sendOrder(){
    const name=document.getElementById("name").value;
    const phone=document.getElementById("phone").value;
    const address=document.getElementById("address").value;
    if(cart.length===0 || !name || !phone || !address){alert("Cart is empty or missing details");return;}

    const btn=document.getElementById("confirmBtn");
    btn.disabled=true; btn.innerText="Processing...";
    const orderId="GOTCHA-"+Math.floor(1000+Math.random()*9000);
    const totalNum=parseInt(document.getElementById("cartTotal").innerText.replace(/,/g,''));
    const itemsSummary=cart.map(i=>`${i.name}(${i.size})x${i.qty}`).join(", ");

    try{
        await fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`,{
            method:"POST", headers:{"Content-Type":"application/json"},
            body:JSON.stringify({chat_id:CONFIG.chatId, text:`NEW ORDER ${orderId}\nClient: ${name}\nPhone: ${phone}\nItems: ${itemsSummary}\nTotal: ${totalNum}`})
        });
        await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}`,{
            method:"POST", headers:{Authorization:`Bearer ${CONFIG.airtableToken}`, "Content-Type":"application/json"},
            body:JSON.stringify({fields:{OrderID:orderId, CustomerName:name, Phone:phone, Address:address, Items:itemsSummary, Total:totalNum, Status:"Pending"}})
        });
        alert("Success! Go to 'My Orders' to track your purchase.");
        cart=[]; saveAndRefresh();
    } catch(e) { alert("Error."); }
    btn.disabled=false; btn.innerText="Confirm Order";
}
window.onload=updateCartUI;
</script>

</body>
</html>
