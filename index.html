<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOTCHA</title>

<style>
body{
  background:#0b0b0b;
  color:#f5f5f0;
  font-family:Arial;
  text-align:center;
}
.card{
  background:#111;
  padding:20px;
  margin:20px auto;
  width:300px;
}
img{width:100%;}
button{
  padding:12px;
  width:100%;
  margin-top:10px;
  background:#12c9c0;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
input, select, textarea{
  width:100%;
  padding:8px;
  margin:5px 0;
}
</style>
</head>

<body>

<h1>GOTCHA</h1>

<div class="card">
  <img src="https://i.ibb.co/7tc0CRN8/IMG-4922.jpg">
  <h3>CULTURAL TREASURE (WHITE)</h3>
  <p>48,000 MMK</p>
</div>
<div id="orderSection">
<h2>Checkout</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<textarea id="address" placeholder="Delivery Address"></textarea>

<h3>Select Payment Method</h3>
<select id="payment">
  <option value="">Choose Payment</option>
  <option value="kbz">KBZ Pay (Prepay)</option>
  <option value="cod">Cash On Delivery</option>
</select>

<h3>Scan KBZPay QR</h3>
<img src="IMG_5466.jpeg" width="250">

<h3>Select Size</h3>
<select id="size">
  <option value="">Choose Size</option>
  <option value="S">Small (S)</option>
  <option value="M">Medium (M)</option>
  <option value="L">Large (L)</option>
  <option value="XL">Extra Large (XL)</option>
</select>

<input type="number" id="quantity" placeholder="Quantity" min="1" value="1">

<p>Shipping: 3,000 MMK</p>
<p>Total: <span id="totalPrice">51000</span> MMK</p>

<button onclick="sendOrder()">Confirm Order</button>
</div>
<script>

const pricePerItem = 48000;
const shippingFee = 3000;

// Auto update total when quantity changes
document.getElementById("quantity").addEventListener("input", function(){
  const qty = parseInt(this.value) || 1;
  const subtotal = pricePerItem * qty;
  const total = subtotal + shippingFee;
  document.getElementById("totalPrice").innerText = total;
});

async function sendOrder() {

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();
  const payment = document.getElementById("payment").value;
  const quantity = parseInt(document.getElementById("quantity").value);
  const size = document.getElementById("size").value;

  if(!name || !phone || !address || !payment || !quantity || !size){
    alert("Please fill all fields");
    return;
  }

  const orderId = "GOTCHA-" + Math.floor(Math.random() * 100000);

  const subtotal = pricePerItem * quantity;
  const total = subtotal + shippingFee;

  let paymentText = payment === "kbz"
    ? "KBZ Pay (Prepay)"
    : "Cash On Delivery";

  const message =
    "🛒 NEW ORDER\n\n" +
    "Order ID: " + orderId + "\n\n" +
    "Product: CULTURAL TREASURE (WHITE)\n" +
    "Size: " + size + "\n" +
    "Name: " + name + "\n" +
    "Phone: " + phone + "\n" +
    "Address: " + address + "\n" +
    "Quantity: " + quantity + "\n" +
    "Subtotal: " + subtotal + " MMK\n" +
    "Shipping: " + shippingFee + " MMK\n" +
    "Total: " + total + " MMK\n" +
    "Payment: " + paymentText;

  const token = "8514369006:AAFBOUYdlHoYc1Dm8YaJxS3KQWKh6D-N5qU";
  const chat_id = "7194426571";

  try {
    await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        chat_id: chat_id,
        text: message
      })
    });

    alert("Order sent successfully!");
  } catch (error) {
    alert("Error sending order. Check console.");
  }
}

</script>

</body>
</html>
