<!DOCTYPE html>
<html>
<head>
<title>GOTCHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0c0c0c;
  color:white;
}

h1{
  text-align:center;
  padding:20px 0;
}

.products{
  display:flex;
  flex-direction:column;
  gap:30px;
  padding:20px;
}

.product-card{
  background:#151515;
  border-radius:16px;
  padding:20px;
  box-shadow:0 0 25px rgba(0,0,0,0.6);
}

.product-card img{
  width:100%;
  border-radius:12px;
}

.product-title{
  font-size:18px;
  margin-top:15px;
}

.price{
  margin:5px 0 15px;
  color:#12c9c0;
}

select, input, textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
  font-size:14px;
}

button{
  width:100%;
  padding:14px;
  background:#12c9c0;
  border:none;
  border-radius:10px;
  font-weight:bold;
  font-size:15px;
  margin-top:10px;
}

.checkout{
  background:#151515;
  margin:20px;
  padding:20px;
  border-radius:16px;
  box-shadow:0 0 25px rgba(0,0,0,0.6);
}
</style>
</head>

<body>

<h1>GOTCHA</h1>

<div class="products">

<!-- WHITE -->
<div class="product-card">
  <img src="WHITE_IMAGE_LINK">
  <div class="product-title">CULTURAL TREASURE (WHITE)</div>
  <div class="price">48,000 MMK</div>

  <select id="size_white">
    <option value="">Select Size</option>
    <option>S</option><option>M</option><option>L</option><option>XL</option>
  </select>

  <input type="number" id="qty_white" value="1" min="1">

  <button onclick="selectProduct('WHITE')">Select This</button>
</div>

<!-- BLACK -->
<div class="product-card">
  <img src="BLACK_IMAGE_LINK">
  <div class="product-title">CULTURAL TREASURE (BLACK)</div>
  <div class="price">48,000 MMK</div>

  <select id="size_black">
    <option value="">Select Size</option>
    <option>S</option><option>M</option><option>L</option><option>XL</option>
  </select>

  <input type="number" id="qty_black" value="1" min="1">

  <button onclick="selectProduct('BLACK')">Select This</button>
</div>

</div>

<!-- CHECKOUT -->
<div class="checkout" id="orderSection">

<h2>Checkout</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<textarea id="address" placeholder="Delivery Address"></textarea>

<h3>Payment Method</h3>
<select id="payment">
  <option value="">Choose Payment</option>
  <option value="KBZ Pay">KBZ Pay (Prepay)</option>
  <option value="Cash On Delivery">Cash On Delivery</option>
</select>
  <div id="kbzSection" style="display:none; margin-top:15px;">

  <h4>Scan KBZPay QR</h4>
  <img src="KBZ_QR_IMAGE_LINK" width="100%" style="border-radius:10px;">

  <p>Upload Payment Screenshot</p>
  <input type="file" id="paymentScreenshot" accept="image/*">

</div>

<h3>Select Township</h3>
<select id="township" onchange="calculateTotal()">
  <option value="">Choose Township</option>
  <option value="2000">Hlaing (2,000)</option>
  <option value="3000">Sanchaung (3,000)</option>
  <option value="4000">North Dagon (4,000)</option>
  <option value="5000">South Dagon (5,000)</option>
</select>

<p>Shipping: <span id="shippingFee">0</span> MMK</p>
<p>Total: <span id="totalPrice">0</span> MMK</p>

<button onclick="sendOrder()">Confirm Order</button>

</div>

<div class="checkout" id="successSection" style="display:none;">
<h2 style="color:#12c9c0;">Order Confirmed 🎉</h2>
<p>Your Order ID:</p>
<h3 id="displayOrderId"></h3>
</div>

<script>

let selectedProduct="";
const price=48000;

function selectProduct(product){
  selectedProduct=product;
  calculateTotal();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function calculateTotal(){
  let quantity=0;

  if(selectedProduct==="WHITE"){
    quantity=parseInt(document.getElementById("qty_white").value)||0;
  }

  if(selectedProduct==="BLACK"){
    quantity=parseInt(document.getElementById("qty_black").value)||0;
  }

  const shipping=parseInt(document.getElementById("township").value)||0;
  const total=(price*quantity)+shipping;

  document.getElementById("shippingFee").innerText=shipping;
  document.getElementById("totalPrice").innerText=total;

  return{quantity,shipping,total};
}

async function sendOrder(){

  if(!selectedProduct){
    alert("Please select a product first.");
    return;
  }

  const name=document.getElementById("name").value;
  const phone=document.getElementById("phone").value;
  const address=document.getElementById("address").value;
  const payment=document.getElementById("payment").value;

  let size="";
  let quantity=0;

  if(selectedProduct==="WHITE"){
    size=document.getElementById("size_white").value;
    quantity=document.getElementById("qty_white").value;
  }

  if(selectedProduct==="BLACK"){
    size=document.getElementById("size_black").value;
    quantity=document.getElementById("qty_black").value;
  }

  if(!name||!phone||!address||!size||!payment){
    alert("Fill all fields.");
    return;
  }

  const {shipping,total}=calculateTotal();
  const orderId="ORD"+Date.now();

  const message=
  "🛒 NEW ORDER\n\n"+
  "Order ID: "+orderId+"\n"+
  "Product: CULTURAL TREASURE ("+selectedProduct+")\n"+
  "Size: "+size+"\n"+
  "Quantity: "+quantity+"\n"+
  "Name: "+name+"\n"+
  "Phone: "+phone+"\n"+
  "Address: "+address+"\n"+
  "Payment: "+payment+"\n"+
  "Shipping: "+shipping+"\n"+
  "Total: "+total+" MMK";

  const token="YOUR_NEW_BOT_TOKEN";
  const chat_id="YOUR_CHAT_ID";

  try{
    await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chat_id:chat_id,text:message})
    });

    document.getElementById("orderSection").style.display="none";
    document.getElementById("successSection").style.display="block";
    document.getElementById("displayOrderId").innerText=orderId;

  }catch(error){
    alert("Error sending order.");
  }
}

</script>

</body>
</html>
