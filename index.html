<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GOTCHA | Official Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
--primary:#d4af37; 
--bg:#0f0f0f;
--card-bg:#1a1a1a;
--text:#ffffff;
--danger:#ff4d4d;
--success:#00bfa6;
}
body{margin:0;font-family:'Segoe UI',Roboto,Arial;background:var(--bg);color:var(--text); line-height: 1.6;}
.container{width:95%;max-width:1100px;margin:auto;padding:20px;}

header{text-align:center; padding: 40px 0;}
h1{color:var(--primary); letter-spacing: 0.5em; font-weight: bold; margin-bottom: 20px;}
.nav-bar { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px; flex-wrap: wrap;}
.nav-link { color: white; text-decoration: none; font-size: 11px; cursor: pointer; opacity: 0.4; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;}
.nav-link.active { opacity: 1; border-bottom: 2px solid var(--primary); padding-bottom: 5px;}

.page { display: none; animation: fadeIn 0.4s ease; }
.page.active { display: block; }
.section{background:var(--card-bg);padding:30px;border-radius:16px; margin-top: 20px; border: 1px solid #222;}

.order-record { background: #222; padding: 20px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid var(--primary); }
.status-badge { padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
.status-pending { background: #444; color: white; }
.status-accepted { background: #b8860b; color: white; }
.status-delivered { background: var(--success); color: black; }

select,input,textarea{width:100%;padding:14px;margin-top:10px;background:#222;border:1px solid #444;border-radius:10px;color:white; box-sizing: border-box;}
.btn{background:var(--primary);color:black;width:100%;margin-top:15px;padding:15px;border:none;border-radius:10px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;}

@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<body>

<div id="toast" style="position:fixed;bottom:20px;right:20px;background:var(--primary);color:black;padding:15px;border-radius:8px;display:none;z-index:1000; font-weight: bold;">Added to Cart 📦</div>

<div class="container">
    <header>
        <h1>GOTCHA</h1>
        <div class="nav-bar">
            <span class="nav-link active" id="link-shop" onclick="switchPage('shop')">Shop</span>
            <span class="nav-link" id="link-orders" onclick="switchPage('orders')">My Orders</span>
        </div>
    </header>

    <!-- SHOP PAGE -->
    <div id="page-shop" class="page active">
        <div class="products" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;">
            <div class="card" style="background:var(--card-bg);padding:20px;border-radius:16px;border:1px solid #333; text-align: center;">
                <img src="https://i.ibb.co/LdsXqW7/image-36.png" style="width:100%; border-radius:10px;">
                <h3>CULTURAL TREASURE (WHITE)</h3>
                <p>48,000 MMK</p>
                <select id="size1"><option value="">Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
                <button class="btn" onclick="addToCart('White Tee', 48000, 'size1')">Add To Cart</button>
            </div>
            <div class="card" style="background:var(--card-bg);padding:20px;border-radius:16px;border:1px solid #333; text-align: center;">
                <img src="https://i.ibb.co/LdsXqW7/image-35.png" style="width:100%; border-radius:10px;">
                <h3>CULTURAL TREASURE (BLACK)</h3>
                <p>48,000 MMK</p>
                <select id="size2"><option value="">Size</option><option>S</option><option>M</option><option>L</option><option>XL</option></select>
                <button class="btn" onclick="addToCart('Black Tee', 48000, 'size2')">Add To Cart</button>
            </div>
        </div>

        <div class="section">
            <h2>Checkout</h2>
            <div id="cartItems" style="margin-bottom: 20px;"></div>
            <h3 style="text-align:right">Total: <span id="cartTotal">0</span> MMK</h3>
            <input id="name" placeholder="Full Name">
            <input id="phone" placeholder="Phone Number">
            <textarea id="address" placeholder="Shipping Address"></textarea>
            <button class="btn" id="confirmBtn" onclick="sendOrder()">Confirm Order</button>
        </div>
    </div>

    <!-- AUTOMATIC ORDERS PAGE -->
    <div id="page-orders" class="page">
        <div class="section">
            <h2 id="orderHeader">Your Orders</h2>
            <div id="resultsList">
                <!-- Orders show here automatically -->
            </div>
            <!-- Hidden Search (only shows if no orders found) -->
            <div id="fallbackSearch" style="display:none; margin-top:20px;">
                <p style="opacity:0.6; font-size:13px;">No saved session found. Enter phone to see your details.</p>
                <input id="trackPhone" placeholder="Enter Phone...">
                <button class="btn" onclick="trackOrders()">Show My Details</button>
            </div>
        </div>
    </div>
</div>

<script>
const CONFIG={
    token: "8631368822:AAHY31uXLftZJjFjXlSiUJszeiMj2hPu6Ik",
    chatId: "7194426571",
    airtableBase: "appG57X3qkk4A5IHP",
    airtableToken: "patChpUg2SUHRGuIh.f98b61f7e06b47534f6e53c55f9fe4469999eb57eec3a23d0b4a4e6a685f4b06",
    airtableTable: "Orders"
};

let cart=JSON.parse(localStorage.getItem("gotchaCart"))||[];

function switchPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('link-' + page).classList.add('active');
    
    if(page === 'orders') {
        const savedPhone = localStorage.getItem("gotchaUserPhone");
        if(savedPhone) {
            document.getElementById("trackPhone").value = savedPhone;
            trackOrders(); 
        } else {
            document.getElementById("fallbackSearch").style.display = "block";
            document.getElementById("resultsList").innerHTML = "<p style='opacity:0.5'>No order history found on this device.</p>";
        }
    }
}

async function trackOrders() {
    const phoneInput = document.getElementById("trackPhone").value.trim();
    const resultsList = document.getElementById("resultsList");
    const fallback = document.getElementById("fallbackSearch");
    
    if(!phoneInput) return;
    
    resultsList.innerHTML = "<p>Loading your treasure...</p>";

    try {
        const url = `https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}?filterByFormula={Phone}='${encodeURIComponent(phoneInput)}'`;
        const res = await fetch(url, { headers: { Authorization: `Bearer ${CONFIG.airtableToken}` } });
        const data = await res.json();
        
        if(data.records.length === 0) {
            resultsList.innerHTML = "<p style='color:var(--danger)'>No orders found for this number.</p>";
            fallback.style.display = "block";
            return;
        }

        // Hide search once we have results
        fallback.style.display = "none";
        
        resultsList.innerHTML = data.records.sort((a,b) => new Date(b.createdTime) - new Date(a.createdTime)).map(record => {
            const f = record.fields;
            const status = f.Status || 'Pending';
            return `<div class="order-record">
                <div style="display:flex;justify-content:space-between;"><strong>${f.OrderID}</strong><span class="status-badge status-${status.toLowerCase()}">${status}</span></div>
                <div style="margin-top:10px;font-size:13px; opacity:0.8;">Items: ${f.Items}<br>Total: ${f.Total.toLocaleString()} MMK</div>
            </div>`;
        }).join('');
    } catch (e) { resultsList.innerHTML = "Error."; }
}

function addToCart(name,price,sizeId){
    const size=document.getElementById(sizeId).value;
    if(!size){alert("Select size");return;}
    const existing=cart.find(i=>i.name===name && i.size===size);
    if(existing){existing.qty++;}else{ cart.push({name,size,price,qty:1}); }
    saveAndRefresh();
    const t=document.getElementById("toast"); t.style.display="block"; setTimeout(()=>{t.style.display="none";},2000);
}

function saveAndRefresh(){ localStorage.setItem("gotchaCart",JSON.stringify(cart)); updateCartUI(); }

function updateCartUI(){
    const div=document.getElementById("cartItems");
    div.innerHTML="";
    let total=0;
    cart.forEach((item,index)=>{
        total+=item.price*item.qty;
        div.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333; font-size: 14px;">
            <span>${item.name} (${item.size}) x${item.qty}</span>
            <button onclick="removeItem(${index})" style="background:none;border:none;color:var(--danger);cursor:pointer;">[x]</button>
        </div>`;
    });
    document.getElementById("cartTotal").innerText=total.toLocaleString();
}

function removeItem(i){ cart.splice(i,1); saveAndRefresh(); }

async function sendOrder(){
    const name=document.getElementById("name").value;
    const phone=document.getElementById("phone").value;
    const address=document.getElementById("address").value;
    if(cart.length===0 || !name || !phone || !address){alert("Fill details");return;}
    
    const btn=document.getElementById("confirmBtn");
    btn.disabled=true; btn.innerText="Sending...";
    
    const orderId="GTC-"+Math.floor(1000+Math.random()*9000);
    const itemsSummary=cart.map(i=>`${i.name}(${i.size})x${i.qty}`).join(", ");
    
    try{
        // SAVE PHONE NUMBER AUTOMATICALLY HERE
        localStorage.setItem("gotchaUserPhone", phone);

        await fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`,{
            method:"POST", headers:{"Content-Type":"application/json"},
            body:JSON.stringify({chat_id:CONFIG.chatId, text:`🚨 NEW ORDER\nID: ${orderId}\nName: ${name}\nPhone: ${phone}\nItems: ${itemsSummary}`})
        });
        await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}`,{
            method:"POST", headers:{Authorization:`Bearer ${CONFIG.airtableToken}`, "Content-Type":"application/json"},
            body:JSON.stringify({fields:{OrderID:orderId, CustomerName:name, Phone:phone, Address:address, Items:itemsSummary, Total:parseInt(document.getElementById("cartTotal").innerText.replace(/,/g,'')), Status:"Pending"}})
        });
        
        alert("Order Received!"); 
        cart=[]; saveAndRefresh(); 
        switchPage('orders'); // Jump straight to their live orders!
    } catch(e) { alert("Error."); }
    btn.disabled=false; btn.innerText="Confirm Order";
}
window.onload=updateCartUI;
</script>

</body>
</html>
