<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOTCHA PRIME - Live Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cart-count { position: absolute; top: -8px; right: -8px; background: #ef4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <script>
        const CONFIG = {
            telegramToken: "8631368822:AAHY31uXLftZJjFjXlSiUJszeiMj2hPu6Ik",
            telegramChatId: "7194426571",
            airtableToken: "PatpzEmXn2kzhAh0d.acdfefca3cd73828e1100481f7d731963b6aad2d6ea905ba1b58ac491f9e1ca3",
            airtableBaseId: "appG57X3qkk4A5IHP",
            airtableTableName: "Orders"
        };
    </script>

    <nav class="bg-black text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold tracking-widest">GOTCHA PRIME</h1>
        <div class="relative cursor-pointer bg-gray-800 p-2 rounded-full" onclick="toggleCart()">
            🛒 <span id="cart-count" class="cart-count">0</span>
        </div>
    </nav>

    <main class="p-6 max-w-4xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center text-center">
            <div class="w-full h-64 bg-gray-200 rounded-xl mb-4 flex items-center justify-center text-gray-400 italic">
                Product Preview
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Prime Test Jersey</h2>
            <p class="text-blue-600 font-semibold text-lg mt-1">$25.00</p>
            <button onclick="addToCart('Prime Test Jersey', 25)" class="mt-6 w-full max-w-xs bg-black text-white py-3 rounded-lg font-bold hover:bg-gray-800 transition shadow-md">
                ADD TO CART
            </button>
        </div>
    </main>

    <div id="cart-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-[100]">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black">YOUR CART</h2>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-black text-xl">✕</button>
            </div>
            
            <div id="cart-items" class="space-y-3 mb-6"></div>
            
            <form id="order-form" onsubmit="handleOrder(event)" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs font-bold text-gray-500 uppercase">Delivery Details</label>
                    <input type="text" id="name" placeholder="Full Name" required class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-black outline-none transition">
                    <input type="text" id="phone" placeholder="Phone Number" required class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-black outline-none transition">
                    <textarea id="address" placeholder="Full Shipping Address" required class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-black outline-none transition h-24"></textarea>
                </div>
                
                <button type="submit" id="submit-btn" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-700 transition shadow-lg">
                    PLACE ORDER NOW
                </button>
            </form>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
            alert("✅ Added to your cart!");
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-gray-400 py-4 text-center">Your cart is empty.</p>';
            } else {
                let total = cart.reduce((sum, i) => sum + i.price, 0);
                container.innerHTML = cart.map(i => `
                    <div class="flex justify-between font-medium border-b pb-2 border-gray-50">
                        <span>${i.name}</span>
                        <span>$${i.price}</span>
                    </div>
                `).join('') + `<div class="flex justify-between pt-2 font-bold text-xl"><span>Total</span><span>$${total}</span></div>`;
            }
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        async function handleOrder(event) {
            event.preventDefault();
            if (cart.length === 0) return alert("Please add an item first!");

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "🚀 SENDING ORDER...";

            const orderData = {
                OrderID: "GOTCHA-" + Math.floor(Math.random() * 10000),
                CustomerName: document.getElementById('name').value,
                Phone: document.getElementById('phone').value,
                Address: document.getElementById('address').value,
                Items: cart.map(i => i.name).join(", "),
                Total: cart.reduce((sum, i) => sum + i.price, 0),
                Status: "Pending"
            };

            try {
                // 1. SAVE TO AIRTABLE
                const airtableResp = await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBaseId}/${CONFIG.airtableTableName}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.airtableToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ fields: orderData })
                });

                // 2. SEND TO TELEGRAM
                const msg = `🔔 *NEW ORDER RECEIVED!*\n\n*Order ID:* ${orderData.OrderID}\n*Customer:* ${orderData.CustomerName}\n*Phone:* ${orderData.Phone}\n*Items:* ${orderData.Items}\n*Total:* $${orderData.Total}\n\n📍 *Address:* ${orderData.Address}`;
                
                await fetch(`https://api.telegram.org/bot${CONFIG.telegramToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CONFIG.telegramChatId, text: msg, parse_mode: 'Markdown' })
                });

                if (airtableResp.ok) {
                    alert("🎉 ORDER PLACED! Check your Telegram and Airtable now.");
                    cart = [];
                    updateCartUI();
                    toggleCart();
                    document.getElementById('order-form').reset();
                } else {
                    const err = await airtableResp.json();
                    alert("Airtable Connection Error: " + err.error.message);
                }
            } catch (error) {
                alert("Something went wrong. Check your internet or tokens.");
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = "PLACE ORDER NOW";
            }
        }
    </script>
</body>
</html>
