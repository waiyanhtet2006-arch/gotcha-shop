<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GOTCHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}
.container{
  width:95%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}
h1{text-align:center;margin-bottom:30px;}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:25px;
}
.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
}
.card img{
  width:100%;
  border-radius:8px;
}
select,input,textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
.add-btn{background:#00bfa6;color:white;margin-top:10px;}
.qty-btn{background:#444;color:white;}
.remove-btn{background:#ff4d4d;color:white;}
.section{
  margin-top:40px;
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
}
.cart-item{
  border-bottom:1px solid #333;
  padding:12px 0;
}
</style>
</head>
<body>

<div class="container">
<h1>GOTCHA</h1>

<!-- PRODUCTS -->
<div class="products">

<div class="card">
<img src="YOUR_WHITE_IMAGE">
<h3>CULTURAL TREASURE (WHITE)</h3>
<p>48,000 MMK</p>
<select id="size1">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
</select>
<button class="add-btn" onclick="addToCart('White',48000,'size1')">Add To Cart</button>
</div>

<div class="card">
<img src="YOUR_BLACK_IMAGE">
<h3>CULTURAL TREASURE (BLACK)</h3>
<p>48,000 MMK</p>
<select id="size2">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
</select>
<button class="add-btn" onclick="addToCart('Black',48000,'size2')">Add To Cart</button>
</div>

</div>

<!-- CART -->
<div class="section">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<h3>Total: <span id="cartTotal">0</span> MMK</h3>
</div>

<!-- CHECKOUT -->
<div class="section">
<h2>Checkout</h2>
<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="address" placeholder="Delivery Address">
<button class="add-btn" onclick="sendOrder()">Confirm Order</button>
</div>

<!-- CANCEL -->
<div class="section">
<h2>Cancel Order</h2>
<input type="text" id="cancelOrderId" placeholder="Enter Order ID">
<textarea id="cancelReason" placeholder="Reason for cancellation"></textarea>
<button class="remove-btn" onclick="cancelOrder()">Submit Cancel Request</button>
</div>

</div>

<script>

const token="YOUR_BOT_TOKEN";
const chat_id="YOUR_CHAT_ID";

let cart=[];

/* ADD TO CART */
function addToCart(name,price,sizeId){
const size=document.getElementById(sizeId).value;
if(!size){alert("Select size");return;}

const existing=cart.find(item=>item.name===name && item.size===size);

if(existing){
existing.qty++;
}else{
cart.push({name,size,price,qty:1});
}
updateCart();
}

/* UPDATE CART DISPLAY */
function updateCart(){
const div=document.getElementById("cartItems");
div.innerHTML="";
let total=0;

cart.forEach((item,index)=>{
total+=item.price*item.qty;

div.innerHTML+=`
<div class="cart-item">
<b>${item.name}</b> (${item.size})<br>
${item.price} MMK<br><br>
<button class="qty-btn" onclick="decreaseQty(${index})">-</button>
${item.qty}
<button class="qty-btn" onclick="increaseQty(${index})">+</button>
<br><br>
<button class="remove-btn" onclick="removeItem(${index})">Remove</button>
<br><br>
Subtotal: ${item.price*item.qty} MMK
</div>`;
});

document.getElementById("cartTotal").innerText=total;
}

/* QUANTITY CONTROLS */
function increaseQty(index){
cart[index].qty++;
updateCart();
}

function decreaseQty(index){
if(cart[index].qty>1){
cart[index].qty--;
}else{
cart.splice(index,1);
}
updateCart();
}

function removeItem(index){
cart.splice(index,1);
updateCart();
}

/* SEND ORDER */
function sendOrder(){

if(cart.length===0){
alert("Cart is empty");
return;
}

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const address=document.getElementById("address").value;

if(!name||!phone||!address){
alert("Fill all fields");
return;
}

const orderId="ORD"+Date.now();

let itemsText="";
cart.forEach(item=>{
itemsText+=`${item.name} (${item.size}) x${item.qty} = ${item.price*item.qty} MMK\n`;
});

let message=`🛒 NEW ORDER\n\nOrder ID: ${orderId}\n\n${itemsText}\nTotal: ${document.getElementById("cartTotal").innerText} MMK\n\nName: ${name}\nPhone: ${phone}\nAddress: ${address}`;

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:chat_id,
text:message
})
});

alert("Order placed! Save your Order ID: "+orderId);

cart=[];
updateCart();
}

/* CANCEL ORDER */
function cancelOrder(){

const orderId=document.getElementById("cancelOrderId").value;
const reason=document.getElementById("cancelReason").value;

if(!orderId||!reason){
alert("You must enter Order ID and reason");
return;
}

let message=`❌ ORDER CANCELLATION REQUEST\n\nOrder ID: ${orderId}\nReason: ${reason}`;

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:chat_id,
text:message
})
});

alert("Cancellation request sent to seller.");
}

</script>

</body>
</html>
