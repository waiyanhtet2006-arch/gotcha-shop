<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gotcha Shop - Order System</title>
    <style>
        /* Modern styling for your shop */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #0056b3; }
        #status-display { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛍️ Gotcha Shop</h2>
    
    <div id="order-form">
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="custName" placeholder="Enter your full name">
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="custPhone" placeholder="000-000-0000">
        </div>
        <div class="form-group">
            <label>Address</label>
            <textarea id="custAddress" rows="3" placeholder="Enter your delivery address"></textarea>
        </div>
        <div class="form-group">
            <label>Items & Sizes</label>
            <textarea id="custItems" rows="3" placeholder="e.g. 2x Black Tee (M), 1x Hoodie (L)"></textarea>
        </div>
        <div class="form-group">
            <label>Total Price ($)</label>
            <input type="number" id="custTotal" value="0">
        </div>
        <button onclick="submitOrder()">Place Order</button>
    </div>

    <div id="status-display"></div>
    <div style="margin-top:20px;">
        <hr>
        <h3>Track Your Order</h3>
        <input type="text" id="trackID" placeholder="Enter your Order ID">
        <button style="margin-top:10px; background-color: #28a745;" onclick="trackOrder()">Check Status</button>
    </div>
</div>

<script>
    // --- UPDATED CONFIGURATION ---
    const CONFIG = {
        // Replace with your real Telegram Bot Token
        telegramToken: "8514369006:AAFBOUYdlHoYc1Dm8YaJxS3KQWKh6D-N5qU",
        // Replace with your real Telegram Chat ID
        chatId: "7194426571",
        // Replace with the ID from your GOTCHA PRIME base (starts with 'app')
        airtableBase: "appG57X3qkk4A5IHP", 
        // Replace with your Personal Access Token (starts with 'pat')
        airtableToken: "pathumdtVHFPwkWob.c2735c2693f85512b52ac846aedc99ee09581424b1dcf8c8c56191c1341197e0",
        // Matches the table tab name in your screenshot
        airtableTable: "Orders" 
    };

    // Function to generate a random Order ID
    function generateOrderID() {
        return 'GOTCHA-' + Math.random().toString(36).substr(2, 6).toUpperCase();
    }

    async function submitOrder() {
        const orderData = {
            OrderID: generateOrderID(),
            CustomerName: document.getElementById('custName').value,
            Phone: document.getElementById('custPhone').value,
            Address: document.getElementById('custAddress').value,
            Items: document.getElementById('custItems').value,
            Total: parseInt(document.getElementById('custTotal').value),
            Status: "Pending" // Sets default status
        };

        if (!orderData.CustomerName || !orderData.Phone) {
            alert("Please fill in your name and phone number!");
            return;
        }

        try {
            // 1. Send to Airtable
            const airtableResponse = await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${CONFIG.airtableToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ fields: orderData })
            });

            // 2. Send to Telegram
            const msg = `🚀 *New Order: ${orderData.OrderID}*\n👤 Name: ${orderData.CustomerName}\n📞 Phone: ${orderData.Phone}\n📦 Items: ${orderData.Items}\n💰 Total: $${orderData.Total}`;
            await fetch(`https://api.telegram.org/bot${CONFIG.telegramToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CONFIG.chatId, text: msg, parse_mode: 'Markdown' })
            });

            if (airtableResponse.ok) {
                alert(`Success! Your Order ID is: ${orderData.OrderID}`);
                document.getElementById('status-display').style.display = 'block';
                document.getElementById('status-display').style.backgroundColor = '#d4edda';
                document.getElementById('status-display').innerHTML = `Order Placed! ID: ${orderData.OrderID}<br>Status: Pending`;
            }

        } catch (error) {
            console.error("Error:", error);
            alert("Something went wrong. Please try again.");
        }
    }

    async function trackOrder() {
        const id = document.getElementById('trackID').value.trim();
        const display = document.getElementById('status-display');
        
        if (!id) return alert("Enter an Order ID");

        try {
            const response = await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}?filterByFormula={OrderID}='${id}'`, {
                headers: { 'Authorization': `Bearer ${CONFIG.airtableToken}` }
            });
            const data = await response.json();

            if (data.records.length > 0) {
                const status = data.records[0].fields.Status;
                display.style.display = 'block';
                display.style.backgroundColor = '#e2e3e5';
                display.innerText = `Order ${id} Status: ${status}`;
            } else {
                alert("Order ID not found.");
            }
        } catch (error) {
            alert("Error tracking order.");
        }
    }
</script>

</body>
</html>
