<script>

const CONFIG={
token:"YOUR_TELEGRAM_BOT_TOKEN",
chatId:"YOUR_CHAT_ID",
googleScript:"YOUR_GOOGLE_SCRIPT_URL"
};

let cart=JSON.parse(localStorage.getItem("gotchaCart"))||[];

function showToast(msg){
const t=document.getElementById("toast");
t.innerText=msg;
t.style.display="block";
setTimeout(()=>{t.style.display="none";},2500);
}

function addToCart(name,price,sizeId){
const size=document.getElementById(sizeId).value;
if(!size){alert("Please select size");return;}

const existing=cart.find(i=>i.name===name && i.size===size);
if(existing){existing.qty++;}
else{cart.push({name,size,price,qty:1});}

saveAndRefresh();
showToast("Added to cart");
}

function saveAndRefresh(){
localStorage.setItem("gotchaCart",JSON.stringify(cart));
updateCartUI();
}

function updateCartUI(){
const div=document.getElementById("cartItems");
div.innerHTML="";

if(cart.length===0){
div.innerHTML="<p>Your cart is empty</p>";
document.getElementById("cartTotal").innerText="0";
return;
}

let total=0;

cart.forEach((item,index)=>{
total+=item.price*item.qty;

div.innerHTML+=`
<div class="cart-item">
<div>
<b>${item.name}</b> [${item.size}]<br>
<small>${item.price.toLocaleString()} MMK</small>
</div>
<div>
<button onclick="changeQty(${index},-1)">-</button>
<span>${item.qty}</span>
<button onclick="changeQty(${index},1)">+</button>
<button onclick="removeItem(${index})">×</button>
</div>
</div>`;
});

document.getElementById("cartTotal").innerText=total.toLocaleString();
}

function changeQty(i,d){
cart[i].qty+=d;
if(cart[i].qty<=0)cart.splice(i,1);
saveAndRefresh();
}

function removeItem(i){
cart.splice(i,1);
saveAndRefresh();
}

async function sendOrder(){

if(cart.length===0){alert("Cart empty");return;}

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const address=document.getElementById("address").value;

if(!name||!phone||!address){
alert("Fill all details");return;
}

const orderId="GOTCHA-"+Math.random().toString(36).substr(2,6).toUpperCase();

let itemsSummary=cart.map(i=>`${i.name} (${i.size}) x${i.qty}`).join("\n");

let total=document.getElementById("cartTotal").innerText;

const telegramMsg=`NEW ORDER ${orderId}

${name}
${phone}
${address}

${itemsSummary}

Total: ${total} MMK`;

try{

// TELEGRAM
await fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:CONFIG.chatId,
text:telegramMsg
})
});

// GOOGLE SHEETS
await fetch(CONFIG.googleScript,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
orderId:orderId,
items:itemsSummary,
total:parseInt(total.replace(/,/g,'')),
name:name,
phone:phone,
address:address,
status:"Pending"
})
});

alert("Order placed!");

cart=[];
saveAndRefresh();
document.querySelectorAll("input,textarea").forEach(i=>i.value="");

}catch(e){
alert("Error sending order");
}

}

window.onload=updateCartUI;

</script>
