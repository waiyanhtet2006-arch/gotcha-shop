<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GOTCHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}
.container{
  width:95%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}
h1{text-align:center;margin-bottom:30px;}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:25px;
}
.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
}
.card img{
  width:100%;
  border-radius:8px;
}
select,input,textarea{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
}
button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
.add-btn{background:#00bfa6;color:white;margin-top:10px;}
.qty-btn{background:#444;color:white;}
.remove-btn{background:#ff4d4d;color:white;}
.section{
  margin-top:40px;
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
}
.cart-item{
  border-bottom:1px solid #333;
  padding:12px 0;
}
</style>
</head>
<body>

<div class="container">
<h1>GOTCHA</h1>

<div class="products">

<div class="card">
<img src="YOUR_WHITE_IMAGE">
<h3>CULTURAL TREASURE (WHITE)</h3>
<p>48,000 MMK</p>
<select id="size1">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
</select>
<button class="add-btn" onclick="addToCart('White',48000,'size1')">Add To Cart</button>
</div>

<div class="card">
<img src="YOUR_BLACK_IMAGE">
<h3>CULTURAL TREASURE (BLACK)</h3>
<p>48,000 MMK</p>
<select id="size2">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
</select>
<button class="add-btn" onclick="addToCart('Black',48000,'size2')">Add To Cart</button>
</div>

</div>

<div class="section">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<h3>Total: <span id="cartTotal">0</span> MMK</h3>
</div>

<div class="section">
<h2>Checkout</h2>
<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="address" placeholder="Delivery Address">
<button class="add-btn" onclick="sendOrder()">Confirm Order</button>
</div>

<div id="activeOrderSection" class="section" style="display:none;">
<h2>Active Order</h2>
<div id="activeOrderInfo"></div>
<br>
<button class="add-btn" onclick="checkStatus()">Check Latest Status</button>
</div>

<div class="section">
<h2>Cancel Order</h2>
<input type="text" id="cancelOrderId" placeholder="Enter Order ID">
<textarea id="cancelReason" placeholder="Reason for cancellation"></textarea>
<button class="remove-btn" onclick="cancelOrder()">Submit Cancel Request</button>
</div>

</div>

<script>

const token="YOUR_TELEGRAM_BOT_TOKEN";
const chat_id="YOUR_CHAT_ID";

/* 🔥 ADD YOUR AIRTABLE INFO HERE */
const AIRTABLE_BASE_ID="YOUR_BASE_ID";
const AIRTABLE_TOKEN="YOUR_API_TOKEN";
const AIRTABLE_TABLE="Table 1";

let cart=[];

function addToCart(name,price,sizeId){
const size=document.getElementById(sizeId).value;
if(!size){alert("Select size");return;}
const existing=cart.find(item=>item.name===name && item.size===size);
if(existing){existing.qty++;}else{cart.push({name,size,price,qty:1});}
updateCart();
}

function updateCart(){
const div=document.getElementById("cartItems");
div.innerHTML="";
let total=0;
cart.forEach((item,index)=>{
total+=item.price*item.qty;
div.innerHTML+=`
<div class="cart-item">
<b>${item.name}</b> (${item.size})<br>
${item.price} MMK<br><br>
<button class="qty-btn" onclick="decreaseQty(${index})">-</button>
${item.qty}
<button class="qty-btn" onclick="increaseQty(${index})">+</button>
<br><br>
<button class="remove-btn" onclick="removeItem(${index})">Remove</button>
<br><br>
Subtotal: ${item.price*item.qty} MMK
</div>`;
});
document.getElementById("cartTotal").innerText=total;
}

function increaseQty(index){cart[index].qty++;updateCart();}
function decreaseQty(index){if(cart[index].qty>1){cart[index].qty--;}else{cart.splice(index,1);}updateCart();}
function removeItem(index){cart.splice(index,1);updateCart();}

function sendOrder(){

if(cart.length===0){alert("Cart is empty");return;}

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const address=document.getElementById("address").value;

if(!name||!phone||!address){alert("Fill all fields");return;}

const orderId="ORD"+Date.now();

let itemsText="";
cart.forEach(item=>{
itemsText+=`${item.name} (${item.size}) x${item.qty} = ${item.price*item.qty} MMK\n`;
});

let total=document.getElementById("cartTotal").innerText;

/* TELEGRAM SEND */
let message=`🛒 NEW ORDER\n\nOrder ID: ${orderId}\n\n${itemsText}\nTotal: ${total} MMK\n\nName: ${name}\nPhone: ${phone}\nAddress: ${address}`;

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id:chat_id,text:message})
});

/* 🔥 AIRTABLE SAVE */
fetch(`https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE)}`,{
method:"POST",
headers:{
"Authorization":"Bearer "+AIRTABLE_TOKEN,
"Content-Type":"application/json"
},
body:JSON.stringify({
records:[{
fields:{
OrderID:orderId,
CustomerName:name,
Phone:phone,
Address:address,
Items:itemsText,
Total:Number(total),
Status:"Pending"
}
}]
})
});

/* SAVE LOCAL */
localStorage.setItem("activeOrder",JSON.stringify({
orderId:orderId,
itemsText:itemsText,
total:total,
status:"Pending"
}));

displayActiveOrder();
alert("Order placed! Save your Order ID: "+orderId);

cart=[];
updateCart();
}

function displayActiveOrder(){
const data=localStorage.getItem("activeOrder");
if(!data) return;
const order=JSON.parse(data);
document.getElementById("activeOrderSection").style.display="block";
document.getElementById("activeOrderInfo").innerHTML=`
<b>Order ID:</b> ${order.orderId}<br><br>
<pre>${order.itemsText}</pre>
<b>Total:</b> ${order.total} MMK<br>
<b>Status:</b> ${order.status}
`;
}

/* 🔥 CHECK STATUS FROM AIRTABLE */
function checkStatus(){
const data=localStorage.getItem("activeOrder");
if(!data) return;
const order=JSON.parse(data);

fetch(`https://api.airtable.com/v0/${appT7SZbz0yWkw6LU}/${encodeURIComponent(AIRTABLE_TABLE)}?filterByFormula=OrderID='${order.orderId}'`,{
headers:{"Authorization":"Bearer "+pat4nnZLL1nJDoDA8.cf44758238d12e88f521e075d0f48f7e1b8774f5bc109a8746004316dbe98b26
}
})
.then(res=>res.json())
.then(result=>{
if(result.records.length>0){
const status=result.records[0].fields.Status;
order.status=status;
localStorage.setItem("activeOrder",JSON.stringify(order));
displayActiveOrder();
}
});
}

function cancelOrder(){
const orderId=document.getElementById("cancelOrderId").value;
const reason=document.getElementById("cancelReason").value;
if(!orderId||!reason){alert("You must enter Order ID and reason");return;}
let message=`❌ ORDER CANCELLATION REQUEST\n\nOrder ID: ${orderId}\nReason: ${reason}`;
fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id:chat_id,text:message})
});
localStorage.removeItem("activeOrder");
document.getElementById("activeOrderSection").style.display="none";
alert("Cancellation request sent.");
}

window.onload=function(){
displayActiveOrder();
};

</script>

</body>
</html>
