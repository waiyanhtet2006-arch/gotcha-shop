<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GOTCHA | Cultural Treasure</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
--primary:#d4af37; /* Gold theme from previous design */
--bg:#0f0f0f;
--card-bg:#1a1a1a;
--text:#ffffff;
--danger:#ff4d4d;
}
body{margin:0;font-family:'Segoe UI',Roboto,Arial;background:var(--bg);color:var(--text);}
.container{width:90%;max-width:1100px;margin:auto;padding:40px 20px;}
h1{text-align:center;color:var(--primary); letter-spacing: 0.5em; font-weight: bold;}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px;margin-top:40px;}
.card{background:var(--card-bg);padding:20px;border-radius:16px;border:1px solid #333; text-align: center;}
.card img{width:100%; border-radius:10px; transition: 0.3s;}
.card img:hover{transform: scale(1.02);}
select,input,textarea{width:100%;padding:12px;margin-top:12px;background:#222;border:1px solid #444;border-radius:8px;color:white; box-sizing: border-box;}
.add-btn{background:var(--primary);color:black;width:100%;margin-top:15px;padding:12px;border:none;border-radius:8px; font-weight: bold; cursor: pointer;}
.qty-btn{background:#333;color:white;padding:5px 15px; border: none; border-radius: 4px; cursor: pointer;}
.remove-btn{background:var(--danger);color:white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;}
.section{margin-top:50px;background:var(--card-bg);padding:30px;border-radius:16px;}
.cart-item{display:flex;justify-content:space-between;align-items: center; border-bottom:1px solid #333;padding:15px 0;}
#toast{position:fixed;bottom:20px;right:20px;background:var(--primary);color:black;padding:15px;border-radius:8px;display:none; font-weight: bold; z-index: 1000;}
</style>
</head>

<body>

<div id="toast">Item added 📦</div>

<div class="container">

<h1>GOTCHA</h1>

<div class="products">

<!-- Product 1: White -->
<div class="card">
<img src="https://i.ibb.co/LdsXqW7/image-36.png">
<h3>CULTURAL TREASURE (WHITE)</h3>
<p>48,000 MMK</p>
<select id="size1">
<option value="">Select Size</option>
<option>S</option><option>M</option><option>L</option><option>XL</option>
</select>
<button class="add-btn" onclick="addToCart('White Tee', 48000, 'size1')">Add To Cart</button>
</div>

<!-- Product 2: Black -->
<div class="card">
<img src="https://i.ibb.co/LdsXqW7/image-35.png">
<h3>CULTURAL TREASURE (BLACK)</h3>
<p>48,000 MMK</p>
<select id="size2">
<option value="">Select Size</option>
<option>S</option><option>M</option><option>L</option><option>XL</option>
</select>
<button class="add-btn" onclick="addToCart('Black Tee', 48000, 'size2')">Add To Cart</button>
</div>

</div>

<div class="section">
<h2>Cart</h2>
<div id="cartItems"></div>
<h3>Total: <span id="cartTotal">0</span> MMK</h3>
</div>

<div class="section">
<h2>Checkout</h2>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone Number">
<textarea id="address" placeholder="Shipping Address"></textarea>
<button class="add-btn" id="confirmBtn" onclick="sendOrder()">Confirm Order</button>
</div>

</div>

<script>

const CONFIG={
token: "8631368822:AAHY31uXLftZJjFjXlSiUJszeiMj2hPu6Ik",
chatId: "7194426571",
airtableBase: "appG57X3qkk4A5IHP",
airtableToken: "patChpUg2SUHRGuIh.f98b61f7e06b47534f6e53c55f9fe4469999eb57eec3a23d0b4a4e6a685f4b06",
airtableTable: "Orders"
};

let cart=JSON.parse(localStorage.getItem("gotchaCart"))||[];

function showToast(msg){
const t=document.getElementById("toast");
t.innerText=msg;
t.style.display="block";
setTimeout(()=>{t.style.display="none";},2000);
}

function addToCart(name,price,sizeId){
const size=document.getElementById(sizeId).value;
if(!size){alert("Select size");return;}

const existing=cart.find(i=>i.name===name && i.size===size);
if(existing){existing.qty++;}else{
cart.push({name,size,price,qty:1});
}
saveAndRefresh();
showToast("Added to cart");
}

function saveAndRefresh(){
localStorage.setItem("gotchaCart",JSON.stringify(cart));
updateCartUI();
}

function updateCartUI(){
const div=document.getElementById("cartItems");
div.innerHTML="";
let total=0;

cart.forEach((item,index)=>{
total+=item.price*item.qty;

div.innerHTML+=`
<div class="cart-item">
<div>${item.name} (${item.size}) x${item.qty}</div>
<div>
<button class="qty-btn" onclick="changeQty(${index},-1)">-</button>
<button class="qty-btn" onclick="changeQty(${index},1)">+</button>
<button class="remove-btn" onclick="removeItem(${index})">x</button>
</div>
</div>`;
});

document.getElementById("cartTotal").innerText=total.toLocaleString();
}

function changeQty(i,d){
cart[i].qty+=d;
if(cart[i].qty<=0)cart.splice(i,1);
saveAndRefresh();
}

function removeItem(i){
cart.splice(i,1);
saveAndRefresh();
}

async function sendOrder(){

if(cart.length===0){alert("Cart empty");return;}

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const address=document.getElementById("address").value;

if(!name||!phone||!address){alert("Please fill all contact fields");return;}

const btn=document.getElementById("confirmBtn");
btn.disabled=true;
btn.innerText="Processing...";

const orderId="GOTCHA-"+Math.floor(1000 + Math.random() * 9000);

let itemsSummary=cart.map(i=>`${i.name} (${i.size}) x${i.qty}`).join(", ");
let totalStr=document.getElementById("cartTotal").innerText;
let totalNum=parseInt(totalStr.replace(/,/g,''));

try{

// TELEGRAM NOTIFICATION
await fetch(`https://api.telegram.org/bot${CONFIG.token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
chat_id:CONFIG.chatId,
text:`🔔 NEW ORDER ${orderId}\n\nClient: ${name}\nPhone: ${phone}\nAddress: ${address}\n\nItems: ${itemsSummary}\nTotal: ${totalStr} MMK`
})
});

// AIRTABLE RECORD CREATION
const res = await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}`,{
method:"POST",
headers:{
Authorization:`Bearer ${CONFIG.airtableToken}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
fields:{
OrderID:orderId,
CustomerName:name,
Phone:phone,
Address:address,
Items:itemsSummary,
Total:totalNum,
Status:"Pending"
}
})
});

if(res.ok) {
    alert("Order Successful! We will contact you shortly.");
    cart=[];
    saveAndRefresh();
    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("address").value = "";
} else {
    const errData = await res.json();
    console.error("Airtable Error:", errData);
    alert("Error saving to Airtable: " + errData.error.message);
}

}catch(e){
console.log(e);
alert("Connection error. Please try again.");
}

btn.disabled=false;
btn.innerText="Confirm Order";

}

window.onload=updateCartUI;

</script>

</body>
</html>
