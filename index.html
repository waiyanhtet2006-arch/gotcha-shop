<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GOTCHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
}
.container{
  width:95%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}
h1{text-align:center;margin-bottom:30px;}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:25px;
}
.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
}
.card img{
  width:100%;
  border-radius:8px;
}
.card select,.card input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:6px;
}
button{
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
.add-btn{
  width:100%;
  margin-top:15px;
  background:#00bfa6;
  color:white;
}
.remove-btn{
  background:#ff4d4d;
  color:white;
}
.qty-btn{
  background:#00bfa6;
  color:white;
  margin:0 5px;
}
.section{
  margin-top:40px;
  background:#1a1a1a;
  padding:25px;
  border-radius:12px;
}
.cart-item{
  border-bottom:1px solid #333;
  padding:12px 0;
}
textarea,input,select{
  width:100%;
  padding:10px;
  border-radius:6px;
  border:none;
  margin-top:10px;
}

/* KBZ */
#kbzSection{
  display:none;
  text-align:center;
  margin-top:15px;
}
#kbzSection img{
  width:220px;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="container">
<h1>GOTCHA</h1>

<!-- PRODUCTS -->
<div class="products">

<div class="card">
<img src="YOUR_WHITE_IMAGE">
<h3>CULTURAL TREASURE (WHITE)</h3>
<p>48,000 MMK</p>
<select id="size1">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
</select>
<input type="number" id="qty1" value="1" min="1">
<button class="add-btn" onclick="addToCart('White',48000,'size1','qty1')">Add To Cart</button>
</div>

<div class="card">
<img src="YOUR_BLACK_IMAGE">
<h3>CULTURAL TREASURE (BLACK)</h3>
<p>48,000 MMK</p>
<select id="size2">
<option value="">Select Size</option>
<option>S</option>
<option>M</option>
<option>L</option>
</select>
<input type="number" id="qty2" value="1" min="1">
<button class="add-btn" onclick="addToCart('Black',48000,'size2','qty2')">Add To Cart</button>
</div>

</div>

<!-- CART -->
<div class="section">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<h3>Subtotal: <span id="cartSubtotal">0</span> MMK</h3>
<h3>Total: <span id="finalTotal">0</span> MMK</h3>
</div>

<!-- CHECKOUT -->
<div class="section">
<h2>Checkout</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="address" placeholder="Delivery Address">

<select id="payment">
<option value="">Select Payment</option>
<option value="COD">Cash on Delivery</option>
<option value="KBZ Pay">KBZ Pay</option>
</select>

<div id="kbzSection">
  <p>Scan this KBZPay QR to complete payment</p>
  <img src="380E3397-A4B5-405B-BF07-28550EFBE470.jpeg">
  <input type="file" id="paymentScreenshot" accept="image/*">
  <p style="font-size:13px;color:#aaa;">Upload screenshot after payment</p>
</div>

<button class="add-btn" onclick="sendOrder()">Confirm Order</button>
</div>

<!-- ORDER STATUS -->
<div class="section">
<h2>Check Order Status</h2>
<input type="text" id="checkOrderId" placeholder="Enter Order ID">
<button class="add-btn" onclick="checkStatus()">Check Status</button>
<div id="statusResult"></div>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWmdp63HgkXrJDHaENR9nNBN1LKJ2yxA4",
  authDomain: "gotcha-store.firebaseapp.com",
  databaseURL: "https://gotcha-store-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gotcha-store",
  storageBucket: "gotcha-store.firebasestorage.app",
  messagingSenderId: "814881957336",
  appId: "1:814881957336:web:7889469a665d0854f07ead"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const storage = firebase.storage();

let cart=[];

function addToCart(name,price,sizeId,qtyId){
  const size=document.getElementById(sizeId).value;
  const qty=parseInt(document.getElementById(qtyId).value);
  if(!size){alert("Select size");return;}
  const existing=cart.find(i=>i.name===name&&i.size===size);
  if(existing){existing.qty+=qty;}
  else{cart.push({name,size,qty,price});}
  updateCart();
}

function updateCart(){
  const div=document.getElementById("cartItems");
  div.innerHTML="";
  let subtotal=0;
  cart.forEach((item,index)=>{
    subtotal+=item.price*item.qty;
    div.innerHTML+=`
    <div class="cart-item">
      ${item.name} - ${item.size}<br>
      <button class="qty-btn" onclick="changeQty(${index},-1)">-</button>
      ${item.qty}
      <button class="qty-btn" onclick="changeQty(${index},1)">+</button>
      <br>${item.price*item.qty} MMK<br>
      <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
    </div>`;
  });
  document.getElementById("cartSubtotal").innerText=subtotal;
  document.getElementById("finalTotal").innerText=subtotal;
}

function changeQty(i,c){
  cart[i].qty+=c;
  if(cart[i].qty<=0){cart.splice(i,1);}
  updateCart();
}

function removeItem(i){
  cart.splice(i,1);
  updateCart();
}

document.getElementById("payment").addEventListener("change",function(){
  document.getElementById("kbzSection").style.display =
  this.value==="KBZ Pay"?"block":"none";
});

async function sendOrder(){
if(cart.length===0){alert("Cart empty");return;}

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const address=document.getElementById("address").value;
const payment=document.getElementById("payment").value;
const total=document.getElementById("finalTotal").innerText;

if(!name||!phone||!address||!payment){alert("Fill all fields");return;}

const orderId="ORD"+Date.now();
let screenshotURL="";

if(payment==="KBZ Pay"){
  const file=document.getElementById("paymentScreenshot").files[0];
  if(!file){alert("Upload payment screenshot");return;}
  const ref=storage.ref("payments/"+orderId);
  await ref.put(file);
  screenshotURL=await ref.getDownloadURL();
}

await database.ref("orders/"+orderId).set({
orderId,cart,name,phone,address,total,payment,
screenshot:screenshotURL,
status:"Pending",
createdAt:Date.now()
});

/* TELEGRAM NOTIFICATION */
const token="8514369006:AAFBOUYdlHoYc1Dm8YaJxS3KQWKh6D-N5qU";
const chat_id="7194426571";

let message=`🛒 NEW ORDER\n\nOrder ID: ${orderId}\n\n`;
cart.forEach(item=>{
message+=`${item.name} - ${item.size} x${item.qty}\n`;
});
message+=`\nTotal: ${total} MMK\nName: ${name}\nPhone: ${phone}\nAddress: ${address}\nPayment: ${payment}\n`;
if(payment==="KBZ Pay"){message+=`\nScreenshot:\n${screenshotURL}`;}

fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id:chat_id,text:message})
});

alert("Order placed! Your Order ID: "+orderId);
cart=[];
updateCart();
}

function checkStatus(){
const id=document.getElementById("checkOrderId").value;
database.ref("orders/"+id).once("value").then(s=>{
if(!s.exists()){document.getElementById("statusResult").innerHTML="Order not found";return;}
const d=s.val();
document.getElementById("statusResult").innerHTML="Status: "+d.status;
});
}
</script>

</body>
</html>
