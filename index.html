<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GOTCHA | Official Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root{ --primary:#d4af37; --bg:#0f0f0f; --card-bg:#1a1a1a; --text:#ffffff; }
        body{margin:0;font-family:'Segoe UI',Arial;background:var(--bg);color:var(--text);line-height:1.6;}
        .container{width:95%;max-width:1100px;margin:auto;padding:20px;}
        header{text-align:center; padding: 40px 0;}
        h1{color:var(--primary); letter-spacing: 0.5em; font-weight: bold; margin-bottom: 20px;}
        
        /* Navigation */
        .nav-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px;}
        .nav-link { color: white; text-decoration: none; font-size: 11px; cursor: pointer; opacity: 0.4; text-transform: uppercase; letter-spacing: 2px;}
        .nav-link.active { opacity: 1; border-bottom: 2px solid var(--primary); padding-bottom: 5px;}

        /* Sections */
        .page { display: none; }
        .page.active { display: block; }
        .section{background:var(--card-bg);padding:30px;border-radius:16px; margin-top: 20px; border: 1px solid #222;}
        
        /* Buttons & Inputs */
        .btn{background:var(--primary);color:black;width:100%;margin-top:15px;padding:15px;border:none;border-radius:10px; font-weight: bold; cursor: pointer; text-transform: uppercase;}
        input, textarea { width:100%;padding:14px;margin-top:10px;background:#222;border:1px solid #444;border-radius:10px;color:white; box-sizing: border-box;}
        
        .order-card { background:#1a1a1a; padding:18px; border-radius:12px; margin-bottom:12px; border:1px solid #333; }
        .status-badge { background:var(--primary); color:black; font-size:9px; padding:4px 10px; border-radius:50px; font-weight:bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GOTCHA</h1>
        <div class="nav-bar">
            <span class="nav-link active" id="link-shop" onclick="switchPage('shop')">Shop</span>
            <span class="nav-link" id="link-orders" onclick="switchPage('orders')">My Orders</span>
        </div>
    </header>

    <!-- PAGE 1: SHOP (Visible by default) -->
    <div id="page-shop" class="page active">
        <div class="section">
            <h2 style="text-align:center;">CHECKOUT</h2>
            <div id="cartSummary">
                <!-- Cart items would show here -->
                <p style="text-align:center; opacity:0.5;">Your cart is empty</p>
            </div>
            <input id="name" placeholder="Full Name">
            <input id="email" placeholder="Email Address (Optional)">
            <input id="phone" placeholder="Phone Number (09...)">
            <textarea id="address" placeholder="Shipping Address"></textarea>
            <button class="btn" onclick="sendOrder()">Place Order</button>
        </div>
    </div>

    <!-- PAGE 2: MY ORDERS (The Portal) -->
    <div id="page-orders" class="page">
        <div class="section">
            <h2 style="color:var(--primary); letter-spacing: 2px; text-align:center;">CUSTOMER PORTAL</h2>
            
            <!-- Login View -->
            <div id="login-view" style="display:none; text-align:center;">
                <p style="opacity:0.7; font-size: 14px;">Enter your phone or email to see order history.</p>
                <input id="lookup-input" type="text" placeholder="Email or Phone Number" style="text-align:center; max-width:400px; margin:auto;">
                <button class="btn" onclick="dualLookup()" style="max-width:400px; margin: 15px auto;">View Account</button>
            </div>

            <!-- Dashboard View -->
            <div id="orders-view" style="display:none;">
                <p id="user-display" style="font-size: 12px; color: var(--primary); text-align:center; margin-bottom:20px;"></p>
                <div id="resultsList">Loading your orders...</div>
                <button class="btn" style="background:#222; color:white; border: 1px solid #444; margin-top:30px;" onclick="signOut()">Sign Out</button>
            </div>
        </div>
    </div>
</div>

<script>
// --- 1. CONFIGURATION ---
const CONFIG = {
    airtableBase: "appG57X3qkk4A5IHP",
    airtableToken: "patChpUg2SUHRGuIh.f98b61f7e06b47534f6e53c55f9fe4469999eb57eec3a23d0b4a4e6a685f4b06",
    airtableTable: "Orders"
};

let cart = []; // Existing cart logic

// --- 2. STARTUP LOGIC ---
window.onload = () => {
    checkSession(); // Check if they are logged in quietly
};

function switchPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
    
    document.getElementById('page-' + pageId).classList.add('active');
    document.getElementById('link-' + pageId).classList.add('active');
}

// --- 3. ACCOUNT LOGIC ---
function checkSession() {
    const savedID = localStorage.getItem("gotchaUserID");
    if (savedID) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('orders-view').style.display = 'block';
        document.getElementById('user-display').innerText = "Logged in as: " + savedID;
        fetchOrders(savedID);
    } else {
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('orders-view').style.display = 'none';
    }
}

function dualLookup() {
    const input = document.getElementById('lookup-input').value.trim();
    if(input.length < 5) return alert("Please enter a valid Phone or Email");
    localStorage.setItem("gotchaUserID", input);
    checkSession();
}

function signOut() {
    localStorage.removeItem("gotchaUserID");
    location.reload();
}

// --- 4. AIRTABLE LOGIC ---
async function fetchOrders(identity) {
    const list = document.getElementById("resultsList");
    const formula = `OR({Phone}='${identity}', {Email}='${identity}')`;
    const url = `https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}?filterByFormula=${encodeURIComponent(formula)}`;
    
    try {
        const res = await fetch(url, { headers: { Authorization: `Bearer ${CONFIG.airtableToken}` } });
        const data = await res.json();
        
        if(!data.records || data.records.length === 0) {
            list.innerHTML = "<p style='text-align:center; opacity:0.5;'>No orders found.</p>";
            return;
        }

        list.innerHTML = data.records.map(r => `
            <div class="order-card">
                <div style="display:flex; justify-content:space-between;">
                    <strong>${r.fields.OrderID}</strong>
                    <span class="status-badge">${r.fields.Status || 'Pending'}</span>
                </div>
                <div style="font-size:12px; margin-top:10px; opacity:0.7;">${r.fields.Items || 'No items listed'}</div>
            </div>
        `).join('');
    } catch(e) { list.innerHTML = "Error loading history."; }
}

async function sendOrder() {
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const email = document.getElementById("email").value;
    const address = document.getElementById("address").value;

    if(!name || !phone || !address) return alert("Please fill in Name, Phone, and Address.");

    // Tag for automatic login
    localStorage.setItem("gotchaUserID", phone);

    const orderId = "GTC-" + Math.floor(1000 + Math.random() * 9000);
    
    try {
        await fetch(`https://api.airtable.com/v0/${CONFIG.airtableBase}/${CONFIG.airtableTable}`, {
            method: "POST",
            headers: { Authorization: `Bearer ${CONFIG.airtableToken}`, "Content-Type": "application/json" },
            body: JSON.stringify({ fields: { 
                OrderID: orderId, 
                CustomerName: name, 
                Email: email, 
                Phone: phone, 
                Address: address, 
                Items: "Items from Cart", // Placeholder for your cart items
                Status: "Pending" 
            } })
        });
        alert("Order Successful!");
        location.reload();
    } catch(e) { alert("Failed to send order."); }
}
</script>
</body>
</html>
